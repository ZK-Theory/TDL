name: Merge Admission Sweep

# Re-derives review-thread state for every open pull request on a schedule.
#
# Reopening a resolved thread (`unresolveReviewThread`) emits no Actions event,
# so a green `merge-admission` check can outlive a newly live blocker (Codex
# review 3988790015). The merge queue re-checks threads when it builds a queue
# commit, which covers reopens before queueing; this sweep covers the rest:
#
#   * a pull request with a live thread that is in the merge queue is removed;
#   * if its head's `merge-admission` check is currently green, that workflow run
#     is re-run, so current thread state replaces the stale success on the same
#     commit.
#
# Reactions trigger no workflow, and Codex's clean signal is a +1 reaction; its quota
# reply is a comment. A pull request with no live thread whose admission check failed,
# and which a review producer +1'd or answered with a usage limit after that run
# STARTED, gets that run re-run, so the signal is read on the same head (Codex reviews
# on PR #304). The re-run starts after the signal, so it is not repeated.
#
# A comment on a pull request wakes this sweep at once (`issue_comment`). Codex's
# usage-limit reply and its "no major issues" note are comments, so both start a sweep.
# Its +1 alone wakes nothing and waits for the schedule: 7 of the 12 most recent pull
# requests Codex +1'd (2026-10-02) carried no such note. merge-admission.yml has no
# `issue_comment` trigger on purpose: that event's run is attached to the default
# branch's latest commit, not the pull request head, so it could never replace the
# head's failed check. This sweep re-runs the head's own admission run, which lands
# on the head.
#
# Known limit: `gh run rerun` replays the original event, so a run from before the
# gate change reached main re-runs with the evaluator of its original base commit.
# This affects only pull requests opened before that merge; a push to them, or a
# fresh `@codex review`, starts a run on the current gate.
#
# Exposure window. The cron asks for a run every 5 minutes and GitHub does not honour
# that here. Measured 2026-09-11 to 2026-10-02 and re-measured on 2026-10-02 from
# `gh run list --workflow merge-admission-sweep.yml`: 126 runs in 20.6 days, 6.1 a day
# against the 288 a `*/5` schedule asks for. Gap between consecutive runs: minimum 106,
# median 233, maximum 423 minutes. The window for a reopened thread, or a producer
# signal that fires no event, is therefore hours, not the five-to-ten minutes the
# original header promised when Stephen chose the sweep on 2026-09-11 over relying on
# the queue-time check alone. That choice stands to be re-taken on these figures. The
# run list is committed (tests/tools/fixtures/merge_admission_sweep_runs_2026-10-02.json)
# and the tests recompute every figure above from it. The `sweep-cadence` job of
# ars-artefact-currency-watchdog.yml fails when no sweep has succeeded within
# SWEEP_MAX_RUN_AGE (tools/check_merge_admission.py, 8 hours, tunable by Stephen).
# Scheduled workflows run only from the default branch, so this takes effect once merged.

on:
  schedule:
    - cron: "*/5 * * * *"
  # Only `created`: Codex's replies are new comments, and CodeRabbit edits its summary
  # comment on every push, which would start a sweep each time.
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merge-admission-sweep
  cancel-in-progress: false

jobs:
  sweep:
    # `issue_comment` also fires for plain issues, which have no pull request for the sweep
    # to read; GitHub skips the job for them without starting a runner. The payload decides
    # only whether this job runs: nothing below reads a comment's author or body, because
    # anyone can comment on a public pull request and this job holds write scopes.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      checks: read
      # `gh run rerun` for a stale green admission check.
      actions: write
      # dequeuePullRequest. No pull request code is checked out or executed.
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash

    steps:
      # Positive signal: the log says what started this sweep. Passed through env, never
      # interpolated into the script.
      - name: Record what started this sweep
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_PR: ${{ github.event.issue.number }}
        run: |
          echo "Sweep started by ${EVENT_NAME}${COMMENT_PR:+ (comment on pull request #${COMMENT_PR})}"

      - name: Check out the gate from the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            tools
            .github/merge-admission.yml
          sparse-checkout-cone-mode: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Install the configuration parser
        run: pip install "PyYAML>=6"

      # Open pull requests are paginated (--paginate --slurp) rather than capped:
      # a sweep that aborted on page one would replace no green check, silently
      # switching off reopened-thread detection for every PR (Codex review
      # 3990242357). gh pages on the connection carrying `endCursor`; nested
      # connections are not paginated, and the tool refuses any that report
      # hasNextPage, so a pull request with more than 100 threads fails loudly.
      # Verified 2026-09-11: 262 merged PRs over 11 pages matched totalCount
      # exactly, with nested connections truncated on 144 of them.
      - name: Capture thread and admission state for every open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api graphql --paginate --slurp \
            -F owner="${{ github.repository_owner }}" \
            -F name="${{ github.event.repository.name }}" \
            -f query='
              query($owner:String!,$name:String!,$endCursor:String){
                repository(owner:$owner,name:$name){
                  pullRequests(states:OPEN, baseRefName:"main", first:50, after:$endCursor){
                    pageInfo{hasNextPage endCursor}
                    nodes{
                      number
                      id
                      mergeQueueEntry{ id }
                      reviewThreads(first:100){ pageInfo{hasNextPage} nodes{ isResolved isOutdated } }
                      reactions(first:100, content:THUMBS_UP){ pageInfo{hasNextPage} nodes{ content createdAt user{login} } }
                      comments(last:20){ nodes{ createdAt body author{login} } }
                      commits(last:1){
                        pageInfo{hasNextPage}
                        nodes{ commit{ oid statusCheckRollup{ contexts(first:50){
                          pageInfo{hasNextPage}
                          nodes{
                            __typename
                            ... on CheckRun{ databaseId name status conclusion startedAt completedAt checkSuite{ workflowRun{ databaseId file{path} } } }
                          }
                        } } } }
                      }
                    }
                  }
                }
              }' > sweep.json

      - name: Dequeue and re-run where a live thread outlived admission
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python tools/check_merge_admission.py sweep --snapshot sweep.json | tr -d '\r' > actions.txt
          if [ ! -s actions.txt ]; then
            echo "No open pull request has a live thread behind a queued entry or a green admission check."
            exit 0
          fi
          while read -r action target number; do
            case "$action" in
              dequeue)
                gh api graphql -F id="$target" -f query='
                  mutation($id:ID!){ dequeuePullRequest(input:{id:$id}){ mergeQueueEntry{ state } } }' > /dev/null
                echo "::warning::Removed PR #${number} from the merge queue: it has an unresolved review thread."
                ;;
              rerun)
                gh run rerun "$target"
                echo "::warning::Re-ran merge-admission run ${target} for PR #${number}: a live thread outlived its success, or a producer +1 arrived after its failure."
                ;;
              *)
                echo "BLOCKED: unknown sweep action '${action}'" >&2
                exit 1
                ;;
            esac
          done < actions.txt
