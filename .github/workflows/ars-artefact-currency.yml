name: ARS Artefact Currency

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-session-currency:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout workflow subject without submodule cleanup
        # `actions/checkout` traverses the legacy `.superpowers` gitlink while
        # removing credentials, but that gitlink has no .gitmodules mapping.
        # This public-repository checkout deliberately uses no credentials and
        # never invokes Git's submodule machinery.
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Install locked dependencies
        run: |
          python -m pip install uv
          uv sync --locked --extra dev

      - name: Run C-1 artefact contract and session currency
        run: |
          .venv/bin/python -m ruff check \
            research_system/session_exchange/exchange.py \
            research_system/artefacts/runtime.py \
            tests/research_system/contracts/test_06i_stage_a_candidate.py \
            tests/research_system/contracts/test_wp64_session_exchange.py \
            tests/research_system/unit/test_artefact_consumer_boundary.py \
            tests/research_system/unit/test_artefact_runtime.py \
            tests/research_system/integration/test_artefact_authority_commands.py \
            tests/tools/test_check_workflow_liveness.py \
            tools/check_workflow_liveness.py
          .venv/bin/python -m pytest -q \
            tests/tools/test_check_workflow_liveness.py \
            tests/research_system/contracts/test_06i_stage_a_candidate.py \
            tests/research_system/unit/test_artefact_consumer_boundary.py \
            tests/research_system/unit/test_artefact_runtime.py \
            tests/research_system/contracts/test_wp64_session_exchange.py \
            tests/research_system/integration/test_artefact_authority_commands.py::test_register_review_and_use_authority_are_real_durable_commands \
            tests/research_system/integration/test_artefact_authority_commands.py::test_use_authority_rejects_without_independent_review_resolver \
            -o addopts='' -p no:cacheprovider -p no:cov
