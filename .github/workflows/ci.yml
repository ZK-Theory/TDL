name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Required so a blocking check can report on the merge queue's synthetic
  # merge-group commit. Without it a required `lint` stalls the queue, and a
  # non-required one lets a candidate merge without ever running this check.
  # Both currency workflows already carry this trigger.
  merge_group:
    types: [checks_requested]

# The project supports Windows only (decided 2026-09-11). Every job here runs on
# windows-latest, and tests/tools/test_ci_platform_policy.py fails if one does
# not. That decision removed two Linux lanes:
#   * `test`, the unfiltered pytest suite -- advisory (`continue-on-error`) and
#     never observed green, it was failing collection on giotto-tda,
#     topologytoolkit and torch_geometric, which the locked environment omits.
#   * `petls-backend` -- PETLS publishes no Windows wheel, so the lane could
#     exist only on Linux.
# `lint` checks files rather than platform behaviour, so it moved to Windows
# unchanged in substance. See the 2026-09-11 [DECISION] in the vault
# Computational-Log.
jobs:
  lint:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Install uv package manager
        run: pip install uv

      # From the lockfile, matching ars-artefact-currency.yml. A resolving
      # install (`uv pip install -e ".[dev]"`) floats every unpinned dependency:
      # pyproject asks for `ruff>=0.8.0`, so the first run of this job on
      # 2026-09-08 resolved ruff 0.16.6 while uv.lock pins 0.14.9 and
      # .pre-commit-config.yaml pins v0.8.4 -- three versions of the linter for
      # one repo. `.ruff.toml` sets no `[lint] select`, so it inherits ruff's
      # DEFAULT rule set, which changed between those versions: 0 errors under
      # 0.14.9 and 1635 under 0.16.6 on identical bytes. Locking the install
      # makes the gate reproducible; see the 2026-09-10 [DECISION].
      - name: Install dependencies from the lockfile
        run: uv sync --locked --extra dev

      # Blocking. `ruff check .` passes cleanly on main as of 2026-09-08 (71
      # pre-existing errors cleared: F401/F541/F841 removed, E741/E722 fixed,
      # E402 granted per-file ignores in .ruff.toml, listed file-by-file so a
      # NEW script in those directories is still checked). Any regression here
      # is therefore new debt, and must fail the PR rather than accumulate.
      - name: Run ruff linting
        run: .venv/Scripts/python.exe -m ruff check . --output-format=github

  # Not continue-on-error. Added 2026-08-02, after the last recorded run of this
  # workflow, it first executed on 2026-09-08 in PR #277 -- and failed for a real
  # reason: `test_composite_writer_lock_held_directories_reject_ordinary_replacement_before_callback[runtime]`
  # ("held runtime directory was replaceable"). Bisected locally: green through
  # 571236e (#265), red from e13b77b (#267). Its red state is therefore evidence
  # of a store-lock regression that landed while CI was disabled, not a broken
  # lane, and it must not be relaxed to turn green. (It is not a ruleset-required
  # check, so it reports rather than blocks the merge queue.) Fixed in #283:
  # held delete-protected directory anchors request FILE_TRAVERSE, so their
  # withheld FILE_SHARE_DELETE is enforced. The direct held-anchor invariants in
  # the selection below watch that fence with no child handles open, beside an
  # unprotected negative control and a directory that denies "List folder".
  #
  # This is also the platform evidence the `merge-admission` gate reads for
  # platform-sensitive pull requests (.github/merge-admission.yml). The gate
  # waits on it, so its timeout must stay below the gate's WAIT_SECONDS budget.
  windows-store-lock:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Install uv package manager
        run: pip install uv

      # From the lockfile, like every lane in this workflow: a resolving install
      # could pick different torch/dev versions for the same SHA.
      - name: Install dependencies from the lockfile
        run: uv sync --locked --extra dev

      - name: Run Windows directory-anchor controls
        run: >-
          .venv\Scripts\python.exe -m pytest -q
          tests/research_system/unit/test_store.py
          tests/research_system/integration/test_wp6_1_scope_task_authority.py
          -k "composite_writer_lock_fails_closed_when_windows_identity_is_unavailable
          or windows_runtime_anchor_rejects_inside_open_identity_swap_without_publication
          or windows_anchor_close_failure_attempts_both_handles_and_preserves_primary_error
          or windows_anchor_close_failure_without_primary_surfaces_first_error
          or directory_anchor_close_failure_retains_live_handle_for_retry
          or composite_writer_lock_held_directories_reject_ordinary_replacement_before_callback
          or windows_delete_protected_anchor_refuses_replacement_of_its_own_directory
          or windows_nested_delete_protected_anchors_coexist_and_each_keeps_the_fence
          or windows_unprotected_anchor_does_not_fence_replacement
          or windows_delete_protected_anchor_fences_a_directory_that_denies_listing"
          -o "addopts=" -p no:cacheprovider -p no:cov

  # The admission gate's and the Windows-only policy's own controls. With the
  # unfiltered `test` lane removed, nothing else runs them, so a later PR could
  # weaken the gate or restore a Linux runner with every required check green
  # (Codex review 3990242343). Blocking, and to be a required check in the
  # P-049 ruleset (decided by Stephen, 2026-09-11).
  admission-controls:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Install uv package manager
        run: pip install uv

      - name: Install dependencies from the lockfile
        run: uv sync --locked --extra dev

      - name: Run merge-admission and CI platform controls
        run: >-
          .venv\Scripts\python.exe -m pytest -q
          tests/tools/test_merge_admission.py
          tests/tools/test_ci_platform_policy.py
          tests/tools/test_admin_bypass_guard_hook.py
          tests/tools/test_ars_currency_workflow_controls.py
          tests/tools/test_check_workflow_liveness.py
          -o "addopts=" -p no:cacheprovider -p no:cov
