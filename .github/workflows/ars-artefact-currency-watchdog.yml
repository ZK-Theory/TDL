name: ARS Artefact Currency Watchdog

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  require-active-currency-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Read workflow states from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" > workflows.json

      - name: Fail closed if the currency workflow is inactive
        run: >-
          python tools/check_workflow_liveness.py
          --workflows-json workflows.json
          --target-path .github/workflows/ars-artefact-currency.yml
