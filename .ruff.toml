line-length = 120

[lint.per-file-ignores]
# Dashboard files - allow imports after try/except blocks
"**/viz/streamlit_app.py" = ["E402"]
"**/viz/dashboard.py" = ["E402"]
"**/viz/test_*.py" = ["E402"]
"**/viz/paraview_states/*.py" = ["F403", "F405", "F401"]
"**/viz/paraview_scripts/*.py" = ["E402", "F403", "F405", "F401"]
"**/models/__init__.py" = ["F401"]  # Module exports
"**/topology/filtration.py" = ["F841"]  # TTK variables
"**/ttk_scripts/*.py" = ["F401"]  # TTK imports
"tests/shared/ttk_*.py" = ["F841"]  # TTK tests
"docs/notebooks/*.ipynb" = ["E402"]  # Notebooks

# Research pipeline entrypoints that deliberately manipulate sys.path before
# importing project modules, and/or import lazily between pipeline steps so a
# long run fails fast on step 1 rather than on an import for step 5. Restructuring
# these to satisfy E402 would rewrite working, result-bearing scripts for no
# behavioural gain. Listed file-by-file rather than by directory glob so that a
# NEW script in these directories is still checked (2026-09-08 [DECISION]).
"financial_tda/validation/compute_continuous_tau_all.py" = ["E402"]
"financial_tda/validation/validate_extended_crises.py" = ["E402"]
"financial_tda/validation/validate_gk_complete.py" = ["E402"]
"trajectory_tda/scripts/bhps_build_steps.py" = ["E402"]
"trajectory_tda/scripts/bhps_pipeline.py" = ["E402"]
"trajectory_tda/scripts/bhps_rerun_nulls.py" = ["E402"]
"trajectory_tda/scripts/bhps_test_income.py" = ["E402"]
"trajectory_tda/scripts/bhps_verify_counts.py" = ["E402"]
"trajectory_tda/scripts/bhps_verify_trajectories.py" = ["E402"]
"trajectory_tda/scripts/p04_appendix_b.py" = ["E402"]
"trajectory_tda/scripts/spanning_pipeline.py" = ["E402"]
