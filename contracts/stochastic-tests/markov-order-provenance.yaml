id: markov-order-provenance
kind: schema

description: >
  Result JSONs produced by permutation-null batteries must expose the stochastic
  provenance needed to reproduce and audit them: the Markov order k of the null
  model, the number of permutations B, the RNG seed, and a null-model label.
  "Markov null" alone is ambiguous — k must be explicit (methodological mandate).
  Without these fields a result cannot be regenerated and the null model cannot be
  verified against the governing design. The paired output-validation contract
  applies this schema to the run_params block of combined Stage-1 battery JSONs.

spec_citation:
  source: "CLAUDE.md methodological mandate (Markov order k always explicit) + statistical-design-audit skill"
  vault_entry_date: "2026-06-02"

schema_def:
  applies_to: "run_params blocks in permutation-null battery result JSONs"
  required_keys:
    - name: markov_order_k
      type: int
      description: "Markov order k of the null model. Must be present and explicit; -1 or null is not acceptable for a Markov null."
    - name: n_permutations
      type: int
      description: "Number of permutations B drawn for the null distribution."
    - name: seed
      type: int
      description: "RNG seed used for the permutation draws, recorded for reproducibility."
    - name: null_model
      type: str
      description: "Null-model label (e.g., 'markov-k', 'order-shuffle', 'stratified-markov'), naming the operation used."

binding:
  test_file: "tests/trajectory_tda/test_markov_order_provenance.py"
  test_function: "test_battery_result_exposes_null_provenance"
  must_assert: >
    The production provenance builder emits markov_order_k (positive int),
    n_permutations (positive int), seed (int), and the exact null_model token
    markov-{k}; null, bool, non-int, or non-positive values fail closed.
