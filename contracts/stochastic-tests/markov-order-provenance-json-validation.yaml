id: markov-order-provenance-json-validation
kind: output_validation

description: >
  Output-validation dispatch for the run_params block of combined Stage-1
  Markov-null battery JSONs. Persisted battery results must satisfy the
  markov-order-provenance schema before they can be accepted as reproducible
  stochastic evidence.

spec_citation:
  source: "markov-order-provenance schema contract and Stage-1 battery output path"
  vault_entry_date: "2026-06-02"

output_validation:
  applies_to_glob: "results/trajectory_tda_integration/stage1/matched_w2_battery_*.json"
  wrapper_key: run_params
  schema_contracts:
    - markov-order-provenance

binding:
  test_file: "tests/trajectory_tda/test_markov_order_provenance.py"
  test_function: "test_markov_order_provenance_output_validation_dispatch"
  must_assert: >
    The exact combined-battery glob dispatches the run_params wrapper to the
    markov-order-provenance schema and no unrelated result surface is widened.
