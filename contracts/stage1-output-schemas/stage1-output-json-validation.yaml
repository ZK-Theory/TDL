id: stage1-output-json-validation
kind: output_validation

description: >
  Stage-1 W2 + landscape L2 result JSONs written under
  results/trajectory_tda_*/stage1/ must conform to the
  stage1-aggregate-output-cell schema. The pre-commit hook validates
  every Stage-1 result JSON staged in a commit against the schema and
  blocks the commit if any required key is missing. This catches
  schema-truncation defects at write time (the T1.36 LM-output schema
  truncation that returned only w2_pvalue and landscape_l2_pvalue,
  dropping the T/d/mean fields, would be blocked here) and at
  commit time independently of whether the test suite exercised the
  exact code path that wrote the file.

spec_citation:
  source: "T1.36 schema-truncation defect post-mortem (2026-05-27)"
  vault_entry_date: "2026-05-27"

output_validation:
  applies_to_glob: "results/trajectory_tda_*/stage1/**/*.json"
  wrapper_key: result
  schema_contracts:
    - stage1-aggregate-output-cell
  # Negative filter, applied before file_dispatch. Both entries are DIFFERENT
  # artifact kinds that the dispatch patterns below unavoidably over-match on
  # filename — neither is a defective battery output, so neither should be
  # judged against the battery's aggregate cell schema.
  exclude_filename_patterns:
    - filename_pattern: "*.provenance.json"
      reason: >
        Null-diagram cache provenance sidecars (null_diagrams_*.provenance.json,
        written beside the .npz caches). They record cache_file / cache_sha256 /
        source_sequences_path, carry no h-cells at all, and match only because
        the cache filename embeds the run tag (e.g. length_matched_truncate_frozen).
        Cache provenance is validated by the data-provenance contracts, not here.
    - filename_pattern: "*headline_frozen_corrected_*.json"
      reason: >
        WT-6 exact-W2 audit corrective artifacts (schema_version
        w2-exact-corrected-headline/v1), written by scratch/w2_fallback_audit/
        03_assemble_audit.py rather than the Stage-1 battery. They hold a
        committed_greedy-vs-corrected_exact comparison and no h0 cell (H0 is
        solver-immune, so the committed H0 stands), which is a deliberate shape,
        not a truncation. Validated by w2-exact-corrected-headline-json-validation.
  # file_dispatch acts as a positive filter — only filenames matching one
  # of these patterns are validated. Pre-fix legacy JSONs (those generated
  # under the buggy p-value denominator before the 2026-05-27 corrective fix)
  # are deliberately excluded; they will be addressed by the T1.2 cascade
  # recompute + disclosure work and are documented as a known historical state.
  # Other Stage-1 outputs (BIC curves, intrinsic-d, landscape sensitivity,
  # stratified Markov legacy mass output, pre-reg manifests) have distinct
  # shapes and require their own schema contracts (out of scope here).
  file_dispatch:
    - filename_pattern: "*headline_frozen_*.json"
      schema_contract: stage1-aggregate-output-cell
    - filename_pattern: "lm_sensitivity_L*_frozen_*.json"
      schema_contract: stage1-aggregate-output-cell
    - filename_pattern: "*length_matched*_frozen_*.json"
      schema_contract: stage1-aggregate-output-cell

binding:
  test_file: "tests/trajectory_tda/test_stage1_output_json_validation.py"
  test_function: "test_stage1_output_jsons_validate_against_aggregate_schema"
  must_assert: >
    Every JSON file in the working tree matching the applies_to_glob
    pattern, when loaded, contains 'h0' and 'h1' keys; each cell is a
    dict containing all required_keys from the stage1-aggregate-output-cell
    schema; conditional_keys are present when their condition holds; no
    forbidden_keys appear. When no matching JSONs exist in the working
    tree (e.g., on a fresh clone), the test passes trivially.
