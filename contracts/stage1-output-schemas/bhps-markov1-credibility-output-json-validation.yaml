id: bhps-markov1-credibility-output-json-validation
kind: output_validation
pending: true

description: >
  Commit-time validation for T1.6 BHPS Markov-1 credibility calibration JSONs.
  Any staged JSON under results/trajectory_tda_bhps/diagnostics matching
  markov1_calibration_*.json must conform to the
  bhps-markov1-credibility-output schema, ensuring frozen-loadings provenance,
  the locked parameters, the calibration/variance flag definitions, and the
  decision-verdict coupling are all present and consistent.

spec_citation:
  source: "T1.6 pre-registration amendment results/trajectory_tda_bhps/diagnostics/pre_registrations_2026-06-13.json (amends the 2026-05-13 H4 entry); P01-B response plan section 6 (H4)"
  vault_entry_date: "2026-06-13"

output_validation:
  applies_to_glob: "results/trajectory_tda_bhps/diagnostics/markov1_calibration_*.json"
  schema_contracts:
    - bhps-markov1-credibility-output

binding:
  test_file: "tests/trajectory_tda/test_t1_6_markov1_credibility_contracts.py"
  test_function: "test_bhps_markov1_credibility_json_validation_dispatch"
  must_assert: >
    Every staged JSON matching
    results/trajectory_tda_bhps/diagnostics/markov1_calibration_*.json is
    dispatched to the bhps-markov1-credibility-output schema; non-matching
    diagnostics JSONs (e.g. markov1_nullnull_variance_*.json) are not
    accidentally captured by this glob.
