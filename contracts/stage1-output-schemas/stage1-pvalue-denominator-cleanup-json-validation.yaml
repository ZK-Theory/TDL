id: stage1-pvalue-denominator-cleanup-json-validation
kind: output_validation
pending: true

description: >
  Cache-based Stage-1 denominator-cleanup JSONs must validate against
  the stage1-pvalue-denominator-cleanup schema at commit time. This
  prevents the T1.36 p-value cleanup from being recorded as an
  informal prose note without the per-cell audit trail needed for the
  methodological disclosure.

spec_citation:
  source: "Manager 3 handoff T1.2 cascade recompute"
  anchor: "pvalue_denominator_cleanup_<date>.json"

output_validation:
  applies_to_glob: "results/trajectory_tda_integration/stage1/*.json"
  schema_contracts:
    - stage1-pvalue-denominator-cleanup
  file_dispatch:
    - filename_pattern: "pvalue_denominator_cleanup_*.json"
      schema_contract: stage1-pvalue-denominator-cleanup

binding:
  test_file: "tests/trajectory_tda/test_stage1_comparison_contracts.py"
  test_function: "test_stage1_pvalue_denominator_cleanup_json_validation_contract"
  must_assert: >
    Every on-disk JSON matching
    results/trajectory_tda_integration/stage1/pvalue_denominator_cleanup_*.json
    satisfies the stage1-pvalue-denominator-cleanup contract. The test
    passes trivially when no cleanup JSON exists yet.

