id: bhps-markov1-credibility-output
kind: schema
pending: true

description: >
  Schema for the T1.6 BHPS Markov-1 rejection-credibility diagnostics. The
  calibration JSON reports, under valid frozen-loadings Markov-1 nulls at
  L=5000, a double-null p-value uniformity test (Kolmogorov-Smirnov of the
  per-trial mean-vs-mean Wasserstein-2 p-values against Uniform(0,1)) and a
  BHPS-vs-USoc null-null coefficient-of-variation variance check, together with
  a three-way credibility verdict whose value is fully determined by the
  calibration and variance flags. Used to lock the P01-B section 4.2.3 prose
  direction for the BHPS Markov-1 W2 rejection.

spec_citation:
  source: "T1.6 pre-registration amendment results/trajectory_tda_bhps/diagnostics/pre_registrations_2026-06-13.json (amends the 2026-05-13 H4 entry); P01-B response plan section 6 (H4)"
  vault_entry_date: "2026-06-13"

schema_def:
  applies_to: "JSON files matching results/trajectory_tda_bhps/diagnostics/markov1_calibration_*.json"
  required_keys:
    - name: schema_version
      type: str
      description: "Schema version tag, MUST be 'stage1/bhps-markov1-credibility/v1'."
    - name: generated_at
      type: str
      description: "ISO 8601 timestamp for the result generation."
    - name: task
      type: str
      description: "Task identifier, MUST begin with 'T1.6'."
    - name: pre_registration
      type: str
      description: "MUST reference the 2026-06-13 T1.6 pre-registration amendment."
    - name: inputs
      type: "dict[str, ...]"
      description: >
        Input provenance. MUST contain git_head and the frozen Markov-1 null
        cache references for BOTH datasets (e.g. bhps_null_cache and
        usoc_null_cache pointing at the frozen B1000 L5000 seed42 npz banks).
    - name: params
      type: "dict[str, ...]"
      description: >
        Locked parameters. MUST contain null_model == 'markov-1',
        frozen_loadings == true, L == 5000, seed == 42,
        n_calibration_trials == 100, calibration_null_bank_B >= 100, and
        p_value_formula == '(r+1)/(B+1)'.
    - name: calibration
      type: "dict[str, ...]"
      description: >
        Double-null uniformity result. MUST contain ks_statistic (float >= 0),
        ks_p (float in [0, 1]), mean_pvalue (float in [0, 1]), and calibrated
        (bool) with calibrated == (ks_p >= 0.05).
    - name: variance
      type: "dict[str, ...]"
      description: >
        Null-null dispersion check. MUST contain bhps_nullnull_cv (float > 0),
        usoc_nullnull_cv (float > 0), and variance_flag (bool) with
        variance_flag == (bhps_nullnull_cv < 0.5 * usoc_nullnull_cv).
    - name: decision
      type: "dict[str, ...]"
      description: >
        Credibility verdict. MUST contain verdict in {'credible',
        'conditionally_credible', 'suspect'}, coupled to the flags:
        verdict == 'suspect' iff NOT calibration.calibrated;
        verdict == 'conditionally_credible' iff calibration.calibrated AND
        variance.variance_flag; verdict == 'credible' iff
        calibration.calibrated AND NOT variance.variance_flag.
  forbidden_keys:
    - name: per_call_pca
      reason: "Nulls must use frozen PCA loadings (post-T1.37), never per-call refit."

binding:
  test_file: "tests/trajectory_tda/test_t1_6_markov1_credibility_contracts.py"
  test_function: "test_bhps_markov1_credibility_output_schema"
  must_assert: >
    The validator accepts a conforming payload and rejects payloads where
    (a) calibration.calibrated disagrees with (ks_p >= 0.05);
    (b) variance.variance_flag disagrees with
    (bhps_nullnull_cv < 0.5 * usoc_nullnull_cv);
    (c) decision.verdict disagrees with the coupling (suspect iff not
    calibrated; conditionally_credible iff calibrated and variance_flag;
    credible iff calibrated and not variance_flag);
    (d) any ks_p, mean_pvalue is outside [0, 1], ks_statistic is negative, or
    either null-null CV is non-positive;
    (e) params null_model != 'markov-1', frozen_loadings != true, L != 5000,
    seed != 42, n_calibration_trials != 100, calibration_null_bank_B < 100, or
    p_value_formula != '(r+1)/(B+1)';
    or (f) the forbidden key per_call_pca is present.
