id: w2-exact-corrected-headline-json-validation
kind: output_validation

description: >
  WT-6 exact-W2 corrected-headline artifacts written under
  results/trajectory_tda_*/stage1/ must conform to the
  w2-exact-corrected-headline-cell schema. These files are citable headlines
  backing P01 H1 claims, but they are NOT Stage-1 battery outputs: they carry
  no 'result' wrapper and no h0 cell, so stage1-output-json-validation
  explicitly excludes them. Without this contract they would be validated by
  nothing at all — which is the state that let the shape drift go unnoticed
  until the stage1 binding test failed on a filename collision (2026-07-15).
  Gate 4 validates each artifact against the cell schema, so a future
  corrected headline that drops the superseded greedy block, the
  diagonal-bound screen, or the rejection-flip flag is blocked rather than
  silently committed.

spec_citation:
  source: "Stage-1 dispatch-scope investigation (2026-07-15): bhps_headline_frozen_corrected_2026-07-14.json over-matched stage1-output-json-validation's '*headline_frozen_*.json' dispatch pattern despite being a different artifact kind"
  vault_entry_date: "2026-07-15"

output_validation:
  applies_to_glob: "results/trajectory_tda_*/stage1/**/*.json"
  # No wrapper_key: the corrected-headline artifact holds its h-cells at the
  # top level, alongside its metadata (schema_version, inputs, solver, method,
  # h0_immunity_gate). The absence of the Stage-1 'result' wrapper is the
  # discriminator between the two artifact kinds, not a defect.
  schema_contracts:
    - w2-exact-corrected-headline-cell
  # Positive filter — the mirror image of the exclusion carried by
  # stage1-output-json-validation. The two contracts share an applies_to_glob
  # and partition it by filename: exactly one of them claims any given file.
  file_dispatch:
    - filename_pattern: "*headline_frozen_corrected_*.json"
      schema_contract: w2-exact-corrected-headline-cell

binding:
  test_file: "tests/trajectory_tda/test_w2_exact_corrected_headline_contracts.py"
  test_function: "test_corrected_headline_jsons_validate_against_cell_schema"
  must_assert: >
    Every JSON in the working tree matching the applies_to_glob and the
    corrected-headline dispatch pattern validates against the
    w2-exact-corrected-headline-cell schema: h-cells are found at the top
    level, each carries all required keys with their declared types, and no
    file carries a top-level 'result' wrapper. The test also asserts the
    partition is exact — no file is claimed by both this contract and
    stage1-output-json-validation, and no Stage-1 battery output is claimed by
    this one. Passes trivially when no matching JSONs exist, as on a fresh
    clone.
