id: spanning-betti-inference-output
kind: schema

description: >
  Schema for the T1.9b spanning-vs-newcomer H0 inferential re-analysis. Resolves
  the T1.9 M3 divergence by attaching a label-permutation null (two-sided p) and
  a within-group bootstrap CI to each statistic, and by reporting a discriminating
  windowed/normalized AUC (excluding the trivial all-isolated near-zero region)
  in addition to the single-epsilon ratio and W2. The decision classifies the
  newcomer-vs-spanning H0 difference as newcomers_robust, spanning_robust, or
  no_robust_difference under the 2026-06-09 dual-metric pre-reg amendment.

spec_citation:
  source: "P01-B response plan section 9 (M3); Spec 'epsilon-star robustness'; T1.9b pre-registration amendment 2026-06-09"
  vault_entry_date: "2026-06-09"

schema_def:
  applies_to: "JSON files matching results/trajectory_tda_spanning/knee_robustness/spanning_betti_inference_*.json"
  required_keys:
    - name: schema_version
      type: str
      description: "Schema version tag, MUST be 'stage1/spanning-betti-inference/v1'."
    - name: generated_at
      type: str
      description: "ISO 8601 timestamp for the result generation."
    - name: task
      type: str
      description: "Task identifier, MUST be 'T1.9b spanning vs newcomer H0 inferential re-analysis'."
    - name: pre_registration
      type: str
      description: "MUST reference the 2026-06-09 T1.9b pre-registration amendment."
    - name: inputs
      type: "dict[str, ...]"
      description: "Input provenance. MUST contain spanning_source, newcomer_source, t19_result_source, and git_head."
    - name: params
      type: "dict[str, ...]"
      description: "Locked parameters. MUST contain matched_sample_size == 8000, eps_stars exactly [0.54, 0.65, 0.7, 0.8], eps_star_locked == 0.54, B_permutation >= 1000, B_bootstrap >= 1000, seed == 42, dual_metric == true, eps_lo (float > 0; the discriminating-window lower bound), statistics exactly ['single_eps_ratio', 'auc_ratio_windowed', 'w2_matched'], and p_value_formula == '(r+1)/(B+1)'."
    - name: observed
      type: "dict[str, ...]"
      description: "Observed matched-sample statistics. MUST include single_eps_ratio_by_eps and auc_ratio_windowed_by_eps over the four locked epsilon keys, w2_matched >= 0, eps_lo, and the observed-equivalence gate against T1.9 values."
    - name: results
      type: "list[dict]"
      description: "MUST contain exactly 4 entries (one per epsilon-star). Each entry MUST include eps_star in {0.54, 0.65, 0.7, 0.8}, single_eps_ratio (float), single_eps_perm_p (float in [0,1]), single_eps_boot_ci ([lo, hi] floats with lo <= hi), auc_ratio_windowed (float), auc_perm_p (float in [0,1]), auc_boot_ci ([lo, hi] floats with lo <= hi), w2_matched (float >= 0), w2_perm_p (float in [0,1]), pvalue_null_draws == B_permutation, and direction_newcomers_gt (bool; the discriminating-statistic direction at that eps_star). P-values and CIs MUST recompute from per_draw."
    - name: per_draw
      type: "dict[str, list[dict]]"
      description: "MUST contain permutation and bootstrap lists with lengths B_permutation and B_bootstrap respectively. Every draw MUST retain draw_index, seed_spawn_key, single_eps_ratio_by_eps over all four eps-star values, auc_ratio_windowed_by_eps over all four eps-star values, and w2_matched >= 0 so p-values and CIs can be recomputed without rerunning PH."
    - name: decision
      type: "dict[str, ...]"
      description: "MUST include outcome (str in {'newcomers_robust', 'spanning_robust', 'no_robust_difference'}), significant_at_locked (bool; true iff the discriminating auc_perm_p at eps_star_locked < 0.05), bootstrap_ci_excludes_parity_at_locked (bool), direction_consistent (bool; discriminating-statistic direction agrees across all 4 eps_stars), dual_metric_satisfied (bool; W2 p < alpha), alpha, and headline (str)."
  forbidden_keys:
    - name: per_call_pca
      reason: "Embeddings must use frozen PCA loadings (post-T1.37), never per-call refit."

binding:
  test_file: "tests/trajectory_tda/test_t1_9b_spanning_inference_contracts.py"
  test_function: "test_spanning_betti_inference_output_schema"
  must_assert: >
    The validator accepts a conforming 4-entry payload and rejects payloads
    where (a) params.B_permutation < 1000 or params.B_bootstrap < 1000 or
    params.seed != 42 or params.dual_metric != true or params.eps_stars !=
    [0.54, 0.65, 0.7, 0.8]; (b) per_draw.permutation or per_draw.bootstrap does
    not have the declared B length or a draw lacks one of the four epsilon-keyed
    retained statistics; (c) results does not have one entry per epsilon-star;
    (d) any *_perm_p is outside [0,1], any *_boot_ci has lo > hi, or any
    w2_matched is negative; (e) p-values, CIs, or decision outcome do not match
    recomputation from per_draw; (f) decision.outcome is not one of the three
    allowed values, or a directional outcome is emitted while any locked
    significance, bootstrap, direction-consistency, or W2 dual-metric gate is
    false; or (g) a forbidden key is present.
