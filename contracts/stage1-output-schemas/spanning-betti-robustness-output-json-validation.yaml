id: spanning-betti-robustness-output-json-validation
kind: output_validation
pending: false

description: >
  Commit-time validation for T1.9 spanning Betti robustness JSONs. Any staged
  JSON under results/trajectory_tda_spanning/knee_robustness matching
  spanning_AUC_W2_*.json must conform to the spanning-betti-robustness-output
  schema, ensuring all four epsilon-star values, all three statistics, and the
  M3 decision are present.

spec_citation:
  source: "P01-B response plan section 9 (M3); Spec 'epsilon-star robustness'; M3 pre-registration 2026-05-13"
  vault_entry_date: "2026-06-08"

output_validation:
  applies_to_glob: "results/trajectory_tda_spanning/knee_robustness/spanning_AUC_W2_*.json"
  schema_contracts:
    - spanning-betti-robustness-output

binding:
  test_file: "tests/trajectory_tda/test_t1_9_spanning_robustness_contracts.py"
  test_function: "test_spanning_betti_robustness_json_validation_dispatch"
  must_assert: >
    Every staged JSON matching
    results/trajectory_tda_spanning/knee_robustness/spanning_AUC_W2_*.json is
    dispatched to the spanning-betti-robustness-output schema; non-matching
    knee_robustness JSONs (e.g. the per-eps spanning_betti_eps_*.json detail
    files) are not accidentally captured.
