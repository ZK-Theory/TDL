id: stratified-markov1-output-json-validation
kind: output_validation
pending: true

description: >
  Frozen stratified Markov-1 JSONs written for T1.37 must validate
  against the stratified-markov1-output schema at commit time. This
  ensures the reissued T1.3 outcome-lock output contains the fields
  needed for A/B/C review and records frozen_loadings=true.

spec_citation:
  source: "Plan Task 1.37 output list"
  anchor: "stratified Markov-1 frozen counterpart"

output_validation:
  applies_to_glob: "results/trajectory_tda_integration/stratified_markov/*.json"
  schema_contracts:
    - stratified-markov1-output
  file_dispatch:
    - filename_pattern: "stratified_markov1_W2_L5000_frozen_*.json"
      schema_contract: stratified-markov1-output

binding:
  test_file: "tests/trajectory_tda/test_stratified_markov_contracts.py"
  test_function: "test_stratified_markov1_output_json_validation_contract"
  must_assert: >
    Every on-disk JSON matching
    results/trajectory_tda_integration/stratified_markov/stratified_markov1_W2_L5000_frozen_*.json
    satisfies the stratified-markov1-output contract. The test passes
    trivially when no matching frozen output exists yet.

