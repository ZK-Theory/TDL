id: spike-result-summary
kind: schema
pending: false

description: >
  Schema for the Discovery Harness Spike result summary. It prevents toy Spike
  success from bypassing assurance review: the metric space must be confirmed,
  the null model must perturb the evaluated input, research-assurance evidence
  must be recorded, and successful results must hand off through
  pre-reg-to-dispatch rather than directly opening an APM task.

spec_citation:
  source: "Discovery-Harness-Plan-16-06-2026 section 6 and section 11 Phase B acceptance"
  vault_entry_date: "2026-06-16"

schema_def:
  applies_to: "YAML/JSON Spike result artifact emitted by /spike after toy-scale compute"
  required_keys:
    - name: schema_version
      type: str
      description: "Schema version tag, MUST be 'discovery/spike-result-summary/v1'."
    - name: candidate_slug
      type: str
      description: "Discovery candidate slug from the Assay and Spike pre-registration."
    - name: source_preregistration
      type: str
      description: "Path to the locked Spike pre-registration artifact."
    - name: completed_at
      type: str
      description: "ISO date on which the toy Spike completed."
    - name: outcome
      type: str
      description: "MUST be one of success, partial, or failure."
    - name: time_box_hours_used
      type: int
      description: "Toy Spike time used in hours; MUST be an integer between 0 and 4."
    - name: metric_space_confirmed
      type: bool
      description: "Whether the Spike successfully constructed the promised metric-space object."
    - name: toy_signal_status
      type: str
      description: "Short status for whether the toy signal was detected, absent, or inconclusive."
    - name: null_model_status
      type: "dict[str, ...]"
      description: "MUST include defined, perturbs_input, and evidence."
    - name: baseline_comparison
      type: "dict[str, ...]"
      description: "MUST name non-empty baselines and state the toy comparison result."
    - name: research_assurance_evidence
      type: "dict[str, ...]"
      description: "MUST include topology, null_model, representation, and provenance evidence."
    - name: artifacts
      type: "list[str]"
      description: "Non-empty list of result artifact paths created or inspected by the Spike."
    - name: decision
      type: str
      description: "MUST be one of dispatch, park, or kill. Only success may dispatch."
    - name: next
      type: str
      description: "Successful Spike results MUST set this to '/pre-reg-to-dispatch'."

binding:
  test_file: "tests/discovery/test_spike_result_contract.py"
  test_function: "test_spike_result_summary_rejects_invalid_success_logic"
  must_assert: >
    The validator accepts a conforming Spike result and rejects artifacts where
    (a) success lacks metric-space confirmation; (b) success lacks a defined
    null model that perturbs the actual input; (c) success bypasses
    /pre-reg-to-dispatch; (d) partial or failure results try to dispatch; or
    (e) a research-assurance lane is missing.
