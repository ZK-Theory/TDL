notes: >
  The twelve T1.34 contracts were authored as pending: true so the pre-commit
  hook does not block on binding tests that live on the Worker's feature
  branch (run/foo-regression-transparency); the Worker clears pending in each
  contract once its test function is present and passing on the feature branch
  (most are now cleared, including the 2026-06-03 tier2-svyglm-headline-output
  schema added for the Option A fallback). Human-review-only claims (substantive interpretation
  of effect sizes for §4.5 / §S8 narrative; reviewer-facing framing of the
  design-based vs model-based agreement) are deliberately NOT contract-
  encoded — they are flagged as such in the Task Prompt. The
  normalised-ipw-trimming contract pins the rule from the 2026-05-13 T1.13
  [DECISION] and additionally requires the individual-weights RDS that the
  prior pipeline did not save (the 2026-05-14 IPW individual-weights gap).
