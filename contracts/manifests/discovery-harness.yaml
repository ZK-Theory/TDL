scope_id: discovery-harness
scope_description: >
  Contracts for the TDA Discovery & Triage Harness front-of-funnel artifacts:
  Scout, Assay, Spike, and the pre-registration seam into APM execution.
authored: "2026-06-16"
authored_by: "Codex on docs/discovery-harness"

contracts:
  - discovery-harness/assay-scorecard
  - discovery-harness/spike-pre-registration
  - discovery-harness/spike-result-summary
  - discovery-harness/strand-comparison-output
  - discovery-harness/strand-comparison-output-json-validation

notes: >
  The assay-scorecard, spike-pre-registration, and spike-result-summary
  contracts are active because their binding tests and validators land with
  the contracts. They guard the PROMOTE threshold, the deliberate exclusion of
  programme-fit from viability scoring, explicit user approval before Spike
  execution, non-invariant toy null evidence, research-assurance evidence, and
  the pre-reg-to-dispatch handoff seam.
  The strand-comparison-output and strand-comparison-output-json-validation
  contracts guard the T-STRAND-1 output JSON: finite-lifetimes-only, frozen
  loadings, calibration gate coupling, verdict-calibration coupling, p-value
  ranges, and absence of forbidden refit keys.
