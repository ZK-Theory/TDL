scope_id: T1.33
scope_description: >
  Per-individual local persistence features on the 90-D bigram embedding via
  kNN sub-cloud Vietoris-Rips, sibling-pair geometric coherence test against
  a constrained-shuffle null over B = 5000 draws on the full-sample
  foo_clusters, and per-feature ICCs with cluster-level bootstrap CIs.
  Substantive FOO finding for P01-A §4.5.x.
authored: "2026-05-29"
authored_by: "Manager 5 (pre-dispatch coverage extraction)"

contracts:
  - topology-invariants/per-individual-knn-local-ph
  - stochastic-tests/constrained-shuffle-null
  - stochastic-tests/icc-cluster-bootstrap
  - topology-invariants/constrained-shuffle-cluster-size-preservation
  - topology-invariants/seed-propagation-foo-topology
  - foo-topology-schemas/per-individual-local-features-output
  - foo-topology-schemas/sibling-pair-permutation-output
  - foo-topology-schemas/foo-topology-output-json-validation
  - foo-topology-schemas/comparator-feature-definitions
  - foo-topology-schemas/topology-distinctiveness-comparison-output
  - stochastic-tests/monte-carlo-permutation-p-value

comparator_amendment:
  authored: "2026-06-01"
  authored_by: "Manager 6 (restored from 2026-05-25 pre-reg amendment; User-confirmed include 2026-06-01)"
  description: >
    The 2026-05-25 T1.33 pre-registration amendment (recorded in the APM
    Tracker) added two simpler-method comparators — C1 (bigram-coordinate
    ICC) and C2 (summary trajectory feature ICC) — to defend the
    topology-distinctive contribution. This amendment was never reflected in
    the Spec or in any contract. On 2026-06-01 the User confirmed including the
    comparators in T1.33 scope; the two contracts above
    (comparator-feature-definitions, topology-distinctiveness-comparison-output)
    were authored to cover them, and the foo-topology-output-json-validation
    dispatch was extended to the comparison JSON. Both are pending: true like
    the rest of the T1.33 set.

notes: >
  All eight T1.33-specific contracts are authored as pending: true so the
  pre-commit hook does not block on binding tests that will live on the
  Worker's feature branch (run/foo-topology-signature). The Worker clears
  pending in each contract once test functions are present and passing on
  the feature branch. The ninth contract (monte-carlo-permutation-p-value)
  is referenced — not re-authored — because the (r+1)/(B+1) p-value formula
  is already pinned and active on main from T1.36/T1.37; the
  sibling-pair-permutation-output schema enforces compliance with it.
  Human-review-only claims (substantive interpretation of any positive FOO
  signal for the §4.5.x narrative; reviewer-facing framing) are deliberately
  NOT contract-encoded — they are flagged as such in the Task Prompt.
