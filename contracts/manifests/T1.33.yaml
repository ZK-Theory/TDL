notes: >
  All eight T1.33-specific contracts are authored as pending: true so the
  pre-commit hook does not block on binding tests that will live on the
  Worker's feature branch (run/foo-topology-signature). The Worker clears
  pending in each contract once test functions are present and passing on
  the feature branch. The ninth contract (monte-carlo-permutation-p-value)
  is referenced — not re-authored — because the (r+1)/(B+1) p-value formula
  is already pinned and active on main from T1.36/T1.37; the
  sibling-pair-permutation-output schema enforces compliance with it.
  Human-review-only claims (substantive interpretation of any positive FOO
  signal for the §4.5.x narrative; reviewer-facing framing) are deliberately
  NOT contract-encoded — they are flagged as such in the Task Prompt.
