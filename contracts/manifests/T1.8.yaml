scope_id: T1.8
scope_description: >
  Markov-2 Laplace-smoothing alpha sensitivity sweep for P01-B M5: run the
  Markov-2 null at alpha in {0, 0.5, 1, 5} on USoc and BHPS at L=5000 under
  frozen PCA loadings, report total persistence, mean obs-null Wasserstein-2,
  and the (r+1)/(B+1) permutation p-value per cell, and assess whether the
  rejection conclusion is stable across alpha (locking alpha=1 as canonical).
