scope_id: research-assurance
scope_description: >
  Layer-3 deterministic enforcement authored alongside the research-assurance
  skillset. Contracts here back the judgment skills with mechanical checks: null
  operations must perturb the PH input, and permutation-null battery results must
  carry their stochastic provenance. Both land pending until their binding tests
  are authored and on the base branch.
authored: "2026-06-02"
authored_by: "Manager 6 (research-assurance implementation, Workstream E)"

contracts:
  - topology-invariants/null-operation-changes-ph-input
  - stochastic-tests/markov-order-provenance
  - stochastic-tests/markov-order-provenance-json-validation
  - stochastic-tests/sample-provenance-ledger-block
  - stochastic-tests/sample-provenance-ledger
  - data-provenance/paper-table-source-reconciliation

notes: >
  The null-operation and Markov-order contracts are active: their binding tests
  exercise the re-embedding/PH seam and the exact typed provenance producer,
  while a dedicated output-validation contract dispatches persisted combined
  Stage-1 battery run_params blocks. The sample-provenance ledger contracts are
  active and bind the
  2026-06-03b fitted-count provenance rule to panel model-fitting outputs. The
  markov-order-provenance schema is the definition. Already-covered checks
  (p-value denominator, frozen-loadings comparability, JSON schema completeness)
  are NOT duplicated here — see the T1.36 manifest and the foo-topology schemas.
  The paper-table-source-reconciliation invariant is active (not pending): its
  binding test (tests/contracts/test_paper_table_reconciliation.py) is authored
  on the same branch and gates the P01-B §4.2 table against its certified sources
  and the exact-solver stamp requirement.
