  - stochastic-tests/markov-order-provenance
  - stochastic-tests/sample-provenance-ledger-block
  - stochastic-tests/sample-provenance-ledger
  - data-provenance/paper-table-source-reconciliation

notes: >
  The null-operation and Markov-order contracts are pending:true — their binding tests
  (tests/trajectory_tda/test_null_operation_invariance.py and
  tests/trajectory_tda/test_markov_order_provenance.py) are not yet authored.
  Transition out of pending (remove the field) as each binding test lands on the
  base branch. The sample-provenance ledger contracts are active and bind the
  2026-06-03b fitted-count provenance rule to panel model-fitting outputs. The
  markov-order-provenance schema is the definition; the
  output_validation dispatch wiring it to the battery result glob is added when
  the schema is exercised against real battery outputs. Already-covered checks
  (p-value denominator, frozen-loadings comparability, JSON schema completeness)
  are NOT duplicated here — see the T1.36 manifest and the foo-topology schemas.
  The paper-table-source-reconciliation invariant is active (not pending): its
  binding test (tests/contracts/test_paper_table_reconciliation.py) is authored
  on the same branch and gates the P01-B §4.2 table against its certified sources
  and the exact-solver stamp requirement.
