scope_id: T1.28
scope_description: >
  Recompute each demographic subgroup's Markov-1 W2 test (gender, NS-SEC,
  cohort) under the locked frozen-loadings pipeline for USoc and BHPS, then
  apply per-family FDR (BH gender, BH NS-SEC, BY cohort) with effect sizes —
  superseding the legacy pooled-single-family 06_stratified.json (B=100,
  pre-frozen, pairwise-between-subgroup). Closes P01-A response-plan ISSUE B8.
authored: "2026-06-27"
authored_by: "Manager 12 (pre-dispatch contract + manifest preparation)"

