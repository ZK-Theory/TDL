id: foo-topology-output-json-validation
kind: output_validation

description: >
  Output-validation dispatch for T1.33 FOO topology result JSONs written
  under results/trajectory_tda_integration/foo_topology/. Files whose names
  match per_individual_local_features_*.json validate against the
  per-individual-local-features-output schema; files matching
  sibling_pair_permutation_*.json validate against the sibling-pair-
  permutation-output schema; files matching
  topology_distinctiveness_comparison_*.json validate against the
  topology-distinctiveness-comparison-output schema. The pre-commit hook
  validates any matching JSON staged in a commit and blocks the commit if any
  required key is missing or a forbidden key is present. This catches
  output-shape drift at write time, independent of whether the pytest binding
  exercised the exact code path.

spec_citation:
  source: "Plan Task 1.33 + per-individual-local-features-output and sibling-pair-permutation-output schema contracts"
  vault_entry_date: "2026-05-25"

output_validation:
  applies_to_glob: "results/trajectory_tda_integration/foo_topology/**/*.json"
  schema_contracts:
    - per-individual-local-features-output
    - sibling-pair-permutation-output
    - topology-distinctiveness-comparison-output
  file_dispatch:
    - filename_pattern: "per_individual_local_features_*.json"
      schema_contract: per-individual-local-features-output
    - filename_pattern: "sibling_pair_permutation_*.json"
      schema_contract: sibling-pair-permutation-output
    - filename_pattern: "topology_distinctiveness_comparison_*.json"
      schema_contract: topology-distinctiveness-comparison-output

binding:
  test_file: "tests/trajectory_tda/test_foo_topology_contracts.py"
  test_function: "test_foo_topology_output_jsons_validate_against_schemas"
  must_assert: >
    Every JSON file in the working tree matching the applies_to_glob, when
    loaded, is dispatched to the correct schema contract by file_dispatch
    pattern and validates against its required_keys (and forbidden_keys
    rejection). When no matching JSONs exist in the working tree (e.g., on
    a fresh clone before T1.33 has run), the test passes trivially. When a
    matching JSON exists with a missing required key or a forbidden key, the
    test fails with a diagnostic naming the file and the violated key.
