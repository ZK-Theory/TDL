id: dedup-equivalence-canary
kind: invariant

description: >
  Behavioural invariant for the length-matched external-dedup scheme: for
  a real-world Stage-1 length-matched landmark sample (the existing T1.2f
  truncate frozen observed landmarks from the 2026-05-29 merged result),
  the Rips PD computed under the new scheme (ripser.ripser on the
  externally deduplicated subset X[I] where I is the greedy-permutation
  index set from compute_greedy_dedup_count at tau_float = 1e-10) must be
  identical to the PD computed under the existing exact-ripser path
  (ripser.ripser on X) in both H0 and H1, with bottleneck distance
  <= tau_float in each dimension. This is the canary that closes the
  methodological loop on the 2026-05-30 [DECISION]: it verifies the
  identity PD(X) = PD(X[I]) on data that the paper actually relies on,
  not just on synthetic toy inputs. The initial 2026-05-30 canary run
  established empirically that ripser's internal n_perm shortcut yields
  a non-zero H0 deviation (~3e-8) — the contract was revised to mandate
  external indexing precisely because that route closes the gap.

spec_citation:
  source: "2026-05-30 vault [DECISION] — Pre-reg #5 redo amendment, Validation section ('Canary equivalence test required before any T1.2g re-run is dispatched')"
  vault_entry_date: "2026-05-30"

invariant:
  claim: >
    Let L_obs be the T1.2f truncate frozen observed L=5000 maxmin landmark
    sample (regenerated deterministically from the committed BHPS
    checkpoint at the locked seed and frozen-loadings basis, OR loaded from
    a pinned canary fixture). Let (N_obs, eps_N, I_obs) =
    compute_greedy_dedup_count(L_obs) where I_obs is the length-N_obs
    greedy-permutation index array. Let PD_exact = ripser.ripser(L_obs,
    maxdim=1) and PD_dedup = ripser.ripser(L_obs[I_obs], maxdim=1). The
    bottleneck distance must satisfy d_B(H0) <= tau_H0 = 1e-6 AND
    d_B(H1) <= tau_H1 = 1e-10. The per-dimension tolerance is locked by
    the formula contract: H1 is strict (1e-10) because the paper claims
    operate on H1 (career-trajectory loops); H0 is relaxed (1e-6) because
    persim's bottleneck matching of extra near-duplicate H0 features uses
    float32 internals and hits a precision floor at ~3e-8 — well below any
    meaningful H0 lifetime (~20+) in our data. If either assertion fails,
    the formula contract must be re-evaluated before any T1.2g re-run is
    committed.
  preconditions:
    - "ripser.ripser is from the pinned ripser 0.6.14."
    - "The pinned canary diagnostic .apm/diagnostics/dedup-equivalence-canary.json is present for fast hook validation; setting REGENERATE_DEDUP_CANARY=1 requires the BHPS checkpoint (01_trajectories_sequences.json + 02_embedding.json) at the canonical PROJ_ROOT path and regenerates the diagnostic."
    - "When regenerated, the frozen ngram_embed basis is recreated deterministically from the truncate strategy by the same code path used in production (run_bhps_length_matched.py)."
    - "The persim library (or scikit-tda compatible) provides bottleneck distance computation; the binding test imports it and uses it."
  counter_example_history: >
    The 2026-05-25 [NEGATIVE] null-layer audit identified a class of
    failures in which methodological changes to the PH computation
    silently invalidated downstream cells. The dedup-via-n_perm scheme is
    a methodological change of the same class. This canary contract is
    the gate that prevents the analogous silent failure for length-matched
    cells. If the canary fails, the 2026-05-30 [DECISION] must be revisited.

binding:
  test_file: "tests/trajectory_tda/test_length_matched_dedup_contracts.py"
  test_function: "test_dedup_equivalence_canary_on_t12f_truncate_landmarks"
  must_assert: >
    The fast hook path validates the pinned canary diagnostic
    .apm/diagnostics/dedup-equivalence-canary.json generated from the T1.2f
    truncate frozen observed L=5000 landmark sample: it asserts strategy =
    'truncate', target_years = 13, L = 5000, n_perm_used = 4861,
    covering_radius_at_n_perm <= tau_float = 1e-10,
    bottleneck_distances['H0'] <= tau_H0 = 1e-6, and
    bottleneck_distances['H1'] <= tau_H1 = 1e-10. With
    REGENERATE_DEDUP_CANARY=1, the same binding test recomputes PD_exact =
    ripser.ripser(landmarks, maxdim=1) and PD_dedup =
    ripser.ripser(landmarks[I_obs], maxdim=1), then overwrites the diagnostic
    with the measured bottleneck distances and tolerances.
