id: stratified-markov-frozen-loadings-runner
kind: invariant

description: >
  The T1.37 stratified Markov-1 rerun is part of the frozen-loadings
  corrective path. Every per-regime Markov-null embedding generated by
  the stratified runner must use the observed per-regime scaler/PCA
  loadings via the frozen_models pathway, and the output JSON must record
  frozen_loadings=true in its parameters. Running the stratified rerun
  through the old fit-per-null PCA path would leave the T1.3 Outcome A
  lock exposed to the same coordinate-frame confound that T1.36/T1.37
  were created to correct.

spec_citation:
  source: "Plan Task 1.37 + 2026-05-25 null-layer [NEGATIVE] vault entry"
  anchor: "T1.37 stratified Markov-1 frozen rerun"
  vault_entry_date: "2026-05-25"

invariant:
  claim: >
    When the stratified Markov-1 runner is invoked for the T1.37 frozen
    rerun, it must construct fitted embedding models from the observed
    trajectories for each dataset/regime subset, pass those models to the
    trajectory-level Markov null embedding call, and persist
    params.frozen_loadings == true in the final JSON. A stratified frozen
    output must not be produced by code paths that omit frozen_models.
  preconditions:
    - "The runner is producing the T1.37 stratified Markov-1 frozen counterpart."
    - "Each tested regime has at least the minimum sample size required for PH."
    - "The underlying ngram_embed and permutation_nulls frozen-loadings contracts are active."
  counter_example_history: >
    The 2026-05-25 null-layer audit found Markov-family nulls were
    coordinate-frame confounded because ngram_embed re-fit scaler/PCA
    inside each null draw. T1.36 fixed the low-level pathway; T1.37 must
    ensure the stratified runner actually exercises that pathway.

binding:
  test_file: "tests/trajectory_tda/test_stratified_markov_contracts.py"
  test_function: "test_stratified_markov_runner_threads_frozen_loadings"
  must_assert: >
    A unit-level run of the stratified Markov helper with frozen_loadings
    enabled passes a non-None frozen_models bundle into the per-regime
    _single_permutation call and the produced payload records
    params.frozen_loadings is true. The same test must fail against the
    pre-contract runner path that calls _single_permutation without
    frozen_models.

