id: length-matched-dedup-via-n-perm
kind: formula
pending: true

description: >
  For length-matched Stage-1 cells (T1.2f truncate, T1.2g first13), Rips
  persistent homology is computed via ripser.ripser(X[I]) where I is the
  size-N greedy-permutation index set determined per-landmark-sample as
  the smallest size at which the observed covering radius is at or below
  a numerical tolerance tau_float. The deduplication happens *externally*:
  the caller materialises X[I] and passes it to ripser without n_perm, so
  ripser computes exact Rips PH on the externally deduplicated sample
  rather than relying on its internal greedy permutation (which need not
  agree with this one — verified empirically by the 2026-05-30 canary
  failure under the n_perm shortcut, which produced an H0 bottleneck
  deviation of ~3e-8 on T1.2f truncate landmarks). This is mathematically
  exact, not approximate: the identity PD(L) = PD(unique(L)) holds because
  duplicate points contribute no geometric information to Rips PH. The
  empirical justification is the 2026-05-30 covering-radius diagnostic —
  for the first13 strategy the L=5000 maxmin landmark sample contains
  only ~3500 distinct embedded points, and the Cavanna-Jahanseir-Sheehy
  bottleneck bound at that size evaluates to zero. For truncate the
  diagnostic showed the bound non-zero at every probed N<5000, but the
  canary regeneration found N=4861 distinct points (~139 effective
  duplicates) — the dedup scheme yields a modest speedup there too. The
  contract applies uniformly to both strategies so the comparison-cell
  rule is preserved.

spec_citation:
  source: "2026-05-30 vault [DECISION] — Pre-reg #5 redo amendment for length-matched cells; Cavanna, Jahanseir & Sheehy (2015) 'A geometric perspective on sparse filtrations'; 2026-05-30 canary-failure pivot to external-indexing realisation"
  vault_entry_date: "2026-05-30"

formula:
  expression: "I = greedy_permutation(X, tau_float); PD = ripser.ripser(X[I], maxdim=max_dim) where I = (i_0=0, i_1, ..., i_{N-1}) is the size-N prefix of the greedy permutation starting from row 0 with Euclidean metric, and N is the smallest size at which eps_N = max_j min_{k<N} ||X[j] - X[i_k]||_2 <= tau_float"
  variables:
    L:
      description: "Landmark count per Pre-reg #5 redo; locked at L=5000."
      domain: "positive integer; L = 5000 for length-matched cells"
      implementation_name: "n_landmarks"
    X:
      description: "The L-row landmark matrix produced by maxmin_landmarks on the (re-embedded, frozen-loadings) length-matched sub-sample."
      domain: "real matrix of shape (L, 20)"
      implementation_name: "landmarks (observed) / null_landmarks (per permutation)"
    eps_k:
      description: "Covering radius at greedy-permutation size k: max over all rows of X of the distance from that row to the nearest of the first k selected rows. Computed by a greedy-permutation pass starting from row index 0 with Euclidean (l2) metric."
      domain: "non-negative real; monotone non-increasing in k"
      implementation_name: "min_dists.max() within compute_greedy_dedup_count"
    tau_float:
      description: "Numerical tolerance defining 'exact coverage'. Set at 1e-10 to absorb floating-point noise from PCA projection while still demanding bitwise duplication of embedded points."
      domain: "positive real; tau_float = 1e-10"
      implementation_name: "DEDUP_TOLERANCE"
    N:
      description: "Size of the dedup index set I. Equal to the smallest k for which eps_k <= tau_float; if no such k exists within {1,...,L}, N = L (no dedup, ripser computes PH on the full landmark sample)."
      domain: "positive integer in {1, ..., L}"
      implementation_name: "n_perm_used (run_params field name preserved for continuity; value is size of external dedup index set, not a ripser n_perm argument)"
    I:
      description: "Greedy-permutation index set, a length-N int64 array of row indices into X selected in order by farthest-point traversal starting at row 0. X[I] is the externally deduplicated landmark sample passed to ripser."
      domain: "int64 array, shape (N,)"
      implementation_name: "selected_indices return value of compute_greedy_dedup_count"
    max_dim:
      description: "Maximum homology dimension. Locked at max_dim = 1 for Stage-1 W2 + landscape L2 batteries (H0 + H1 only)."
      domain: "positive integer; max_dim = 1"
      implementation_name: "max_dim"
  invariants:
    - claim: "The identity PD(X) = PD(X[I]) is exact (bottleneck distance zero in every homology dimension within float tolerance) when eps_N <= tau_float, because duplicate points are merged at filtration value zero in Rips and contribute no H1 features. External indexing realises this identity directly — ripser sees the deduplicated sample, with no internal sparse-Rips approximation."
    - claim: "When eps_N <= tau_float, the bottleneck distance between PD(X) and PD(X[I]) is bounded by zero (within float tolerance) per Cavanna-Jahanseir-Sheehy. The 2026-05-30 canary established that in practice this holds at d_B(H1) = 0 exactly under direct ripser calls, while d_B(H0) hits a numerical precision floor at ~3e-8 (the float32 gap 1/2^25) — almost certainly from float32 internals in persim's bottleneck matching for the H0 diagonal-matching of extra near-duplicate features. The contract therefore distinguishes two tolerances: tau_H1 = 1e-10 (strict; verifies the topological identity that drives paper claims) and tau_H0 = 1e-6 (loose; absorbs the persim/ripser H0 float32 floor with margin). Both are orders of magnitude below any meaningful H0 (~20+) or H1 (~2-4) lifetime in our data, so the relaxation is operationally negligible. The implementation records eps_N in the output JSON; a downstream check that eps_N > tau_float invalidates the cell."
      expression: "d_B^{H0}(PD(X), PD(X[I])) <= tau_H0 = 1e-6 AND d_B^{H1}(PD(X), PD(X[I])) <= tau_H1 = 1e-10"
    - claim: "The greedy permutation starts from row index 0 (deterministic given the input ordering) and uses Euclidean distance. Both choices are pinned because eps_N and I depend on them; the dedup count N is a property of the data geometry under the locked start row and metric, not of the seed."
    - claim: "When N == L, the index set I is a permutation of {0,...,L-1} and X[I] is X up to row reordering; Rips PH is invariant under row permutation, so the scheme reduces to the existing exact-ripser path on X. Backward compatibility with the existing T1.36/T1.37 results on non-length-matched cells is preserved by not invoking this contract for those cells."
    - claim: "The same tau_float applies to the observed PD and every null PD within a cell. The recorded n_perm_used (dedup count N) and covering radius are stored per-PD-class (observed; null-summary) in run_params for full provenance."
    - claim: "External indexing (X[I]) is mathematically equivalent to but operationally distinct from ripser's internal n_perm argument. The 2026-05-30 canary established empirically that the n_perm shortcut produces a non-zero H0 bottleneck deviation (~3e-8 on T1.2f truncate) because ripser's internal greedy can select a different N-subset than this contract's greedy. External indexing closes that gap."

binding:
  test_file: "tests/trajectory_tda/test_length_matched_dedup_contracts.py"
  test_function: "test_length_matched_dedup_via_n_perm_construction"
  must_assert: >
    On synthetic landmark matrices with controlled duplication: (a) for a
    matrix with K distinct rows replicated to total 100 rows, the computed
    N equals K within {K, K+1} tolerance for handling float-equality edge
    cases at tau_float = 1e-10; (b) ripser.ripser(X[I], maxdim=1) returns
    a persistence diagram whose bottleneck distance from
    ripser.ripser(unique(X), maxdim=1) is below tau_float in both H0 and
    H1; (c) for an all-distinct synthetic matrix, N equals the matrix size
    L and I is a permutation of {0,...,L-1}, so the scheme reduces to the
    existing exact-ripser path on a reordered X with no behavioural change;
    (d) compute_greedy_dedup_count is deterministic: calling twice on the
    same input yields identical (N, eps_N, I) — the greedy permutation
    starts from row index 0 with Euclidean distance and the result is a
    function of the data geometry under that locked start/metric.
