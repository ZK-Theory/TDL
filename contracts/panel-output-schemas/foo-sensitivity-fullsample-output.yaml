id: foo-sensitivity-fullsample-output
kind: schema
pending: true

description: >
  Schema for the T1.34c full-sample FOO sensitivity JSON written to
  results/panel_methodology/regression/. Records sigma_foo from the
  Tier-2-style fit on the FULL analytical sample (not R2/R6 only), the
  cluster-bootstrap 95% percentile CI per the sigma-foo-cluster-bootstrap
  contract, the full-sample size, and a single sentence framing for the
  §S8 narrative. The schema enforces that the CI is reported as-is, not
  truncated at zero or framed away.

spec_citation:
  source: "Plan Task 1.34 Output block + Pre-reg T1.34c [DECISION] 2026-05-25 + sigma-foo-cluster-bootstrap contract"
  vault_entry_date: "2026-05-25"

schema_def:
  applies_to: "JSON files matching results/panel_methodology/regression/foo_sensitivity_fullsample_*.json"
  required_keys:
    - name: schema_version
      type: str
      description: "Schema version tag, MUST be 'panel-output/foo-sensitivity-fullsample/v1'."
    - name: generated_at
      type: str
      description: "ISO 8601 timestamp."
    - name: task
      type: str
      description: "Task identifier, MUST be 'T1.34c full-sample FOO sensitivity'."
    - name: pre_registration
      type: str
      description: "Date of the T1.34c pre-registration vault entry, e.g. '2026-05-25'."
    - name: params
      type: "dict[str, ...]"
      description: "Provenance block. MUST contain: sample_definition (str == 'full analytical sample, all individuals with valid escape outcome — NOT restricted to R2/R6 starters'), bootstrap_B (int == 1000), seed (int), model_formula (str), engine (str == 'glmmTMB'), family (str == 'binomial')."
    - name: n_full_sample
      type: int
      description: "Full-sample size, expected approximately 27,280 (the full analytical population). MUST be substantially larger than the R2/R6-only Tier-2 sample size (~6,173)."
    - name: n_foo_clusters
      type: int
      description: "Number of FOO clusters in the full sample. Expected approximately 27,972 (per T0.11), with bulk of clusters being singletons."
    - name: sigma_foo
      type: "dict[str, ...]"
      description: "Random-intercept standard deviation. MUST contain: point_estimate (float >= 0), bootstrap_ci_lower (float >= 0), bootstrap_ci_upper (float >= 0), bootstrap_B (int == 1000), ci_method (str == 'percentile'). The CI is reported as-is even if it includes zero."
    - name: ci_includes_zero
      type: bool
      description: "Convenience flag: true iff bootstrap_ci_lower <= some_epsilon (e.g., 1e-6). Used by §S8 prose to choose the right framing without misreporting the CI."
    - name: narrative_sentence
      type: str
      description: "One-sentence framing for §S8. MUST report the CI bounds verbatim. If ci_includes_zero, the sentence acknowledges null evidence; if not, the sentence reports the directional finding. NO 'effect is in the expected direction but not significant' framing — that obscures the CI."
  forbidden_keys:
    - name: sigma_foo_p_value
      reason: "A frequentist p-value for sigma_foo > 0 from a single likelihood ratio test is not the headline; the cluster-bootstrap CI is. If a likelihood ratio test is computed for context, it goes in a separate optional key, NOT here."

binding:
  test_file: "tests/panel/test_t134_regression_contracts.py"
  test_function: "test_foo_sensitivity_fullsample_json_schema"
  must_assert: >
    A synthetic JSON conforming to this schema validates. JSONs with (a)
    n_full_sample not substantially larger than 10,000 (sanity check that
    full sample was used, not R2/R6 subset), (b) sigma_foo.bootstrap_B != 1000,
    (c) sigma_foo.bootstrap_ci_lower > sigma_foo.bootstrap_ci_upper,
    (d) ci_includes_zero == true but narrative_sentence contains "significant",
    or (e) presence of the forbidden sigma_foo_p_value key are rejected with
    a precise diagnostic.
