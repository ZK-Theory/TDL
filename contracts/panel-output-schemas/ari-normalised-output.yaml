id: ari-normalised-output
kind: schema
pending: false

description: >
  Schema for the T1.23 ARI normalisation JSON comparing H0 tree-cut
  components at eps*=0.54 with the locked GMM regime labels. The result
  is a descriptive agreement statistic for P01-A and must preserve the
  canonical embedding/label row order, record the cluster-size-preserving
  null, distinguish exact maximum-achievable ARI from an upper bound, and
  expose bootstrap uncertainty without using stale pickle/joblib labels.

spec_citation:
  source: "P01-A reviewer response B9 ARI normalisation; Manager 8 pre-dispatch contract extraction for T1.23"
  vault_entry_date: "2026-06-06"

schema_def:
  applies_to: "JSON files matching results/panel_methodology/ari/ari_normalised_*.json"
  required_keys:
    - name: schema_version
      type: str
      description: "Schema version tag, MUST be 'ari-normalisation-v1'."
    - name: created_at
      type: str
      description: "ISO date matching the output filename ari_normalised_<created_at>.json."
    - name: git_head
      type: str
      description: "Git HEAD SHA or 'unknown' if unavailable; used for provenance."
    - name: input_paths
      type: "dict[str, ...]"
      description: "Canonical input paths. MUST contain embeddings ending in results/trajectory_tda_integration/embeddings.npy, analysis_json ending in results/trajectory_tda_integration/05_analysis.json, and gmm_labels_key == 'gmm_labels'."
    - name: representation
      type: "dict[str, ...]"
      description: "Representation provenance. MUST contain embedding_source == 'canonical embeddings.npy', gmm_label_source == \"canonical 05_analysis.json['gmm_labels']\", row_alignment == 'same checkpoint directory and row order', and uses_pickle_or_joblib_labels == false."
    - name: parameters
      type: "dict[str, ...]"
      description: "Locked parameters. MUST contain eps_star == 0.54, seed == 42, null_B_requested > 0, bootstrap_B_requested > 0, and n_jobs >= 1."
    - name: label_counts
      type: "dict[str, ...]"
      description: "Label-count provenance. MUST contain n == 27280, h0_label_length == 27280, gmm_label_length == 27280, h0_components with n_components >= 1, gmm_regime_count >= 1, h0_component_counts, and gmm_regime_counts."
    - name: observed_ari
      type: "float [-1, 1]"
      description: "Adjusted Rand Index between reconstructed H0 labels and canonical GMM labels."
    - name: null_distribution
      type: "dict[str, ...]"
      description: "Cluster-size-preserving independence null. MUST contain procedure (str), B (int > 0), seed (int == 42), mean (float), se (float >= 0), and finite_count (int > 0)."
    - name: max_achievable_ari
      type: "dict[str, ...]"
      description: "Maximum-achievable ARI block. MUST contain value (float in [-1, 1]), exact (bool), status (str exactly 'exact' or 'upper_bound'), method (str), pair_overlap_sum (int >= 0), unsplit_non_singleton_components (int >= 0), split_non_singleton_components (int >= 0). If exact == true, status MUST be 'exact' and normalised_observed_ari must be present. If exact == false, status MUST be 'upper_bound' and normalised_ari_upper_bound_scale must be present."
    - name: bootstrap_ci
      type: "dict[str, ...]"
      description: "Bootstrap uncertainty. MUST contain procedure (str), resampling_unit == 'individual', B (int > 0), failures_non_finite (int >= 0), seed (int == 42), and percentile_95 as two ordered finite floats."
    - name: interpretation
      type: "dict[str, ...]"
      description: "Paper-claim-safe interpretation. MUST state whether the normalised value is exact or upper-bound scaled and must not imply causal mediation or topological distinctiveness."
    - name: runtime
      type: "dict[str, ...]"
      description: "Runtime and execution provenance. MUST contain wall_seconds (float >= 0)."
  forbidden_keys:
    - name: pickle_labels_path
      reason: "Locked GMM labels must come from 05_analysis.json[gmm_labels], not stale pickle/joblib artifacts."
    - name: joblib_labels_path
      reason: "Locked GMM labels must come from 05_analysis.json[gmm_labels], not stale pickle/joblib artifacts."
    - name: causal_interpretation
      reason: "ARI is a descriptive agreement statistic, not a causal or mediation estimand."

binding:
  test_file: "tests/panel/test_t123_ari_normalisation_contracts.py"
  test_function: "test_ari_normalisation_output_schema"
  must_assert: >
    The validator accepts a conforming ARI-normalisation payload and rejects
    payloads where (a) schema_version is not 'ari-normalisation-v1';
    (b) input paths do not point to canonical embeddings.npy and 05_analysis.json
    or gmm_labels_key is not 'gmm_labels'; (c) representation uses pickle/joblib
    labels or row_alignment is not the canonical checkpoint row order;
    (d) eps_star != 0.54, seed != 42, or any label length/count n is not 27280;
    (e) observed_ari or max_achievable_ari.value is outside [-1, 1];
    (f) null se is negative/non-finite or bootstrap CI bounds are unordered;
    (g) exact/status/normalised key logic is inconsistent; or (h) a forbidden
    key is present.
