id: stability-stored-se-output-json-validation
kind: output_validation
pending: true

description: >
  Commit-time validation for T1.24b stored-metric stability SE result JSONs. Any
  staged JSON matching results/panel_methodology/uncertainty_addons/stability_se_stored_*.json
  must conform to the stability-stored-se-output schema, enforcing computed_on ==
  'stability_stored' and the per-regime SE recomputation before this B10-closing
  result can be committed.

spec_citation:
  source: "P01-A reviewer response B10 stability SE; Manager 11 task-review 2026-06-22"
  vault_entry_date: "2026-06-22"

output_validation:
  applies_to_glob: "results/panel_methodology/uncertainty_addons/stability_se_stored_*.json"
  schema_contracts:
    - stability-stored-se-output

binding:
  test_file: "tests/panel/test_t124b_stability_stored_se_contracts.py"
  test_function: "test_stability_stored_se_json_validation_dispatch"
  must_assert: >
    The dispatch asserts that (a) every staged JSON matching
    results/panel_methodology/uncertainty_addons/stability_se_stored_*.json is routed
    to the stability-stored-se-output schema, and (b) the legacy
    stability_se_2026-05-16.json and stability_se_2026-05-14.json are NOT captured by
    this glob.
