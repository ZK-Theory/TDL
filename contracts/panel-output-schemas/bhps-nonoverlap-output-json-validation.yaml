id: bhps-nonoverlap-output-json-validation
kind: output_validation
pending: true

description: >
  Commit-time validation for the T1.26 BHPS non-overlap result. Any staged
  JSON under results/panel_methodology/bhps_nonoverlap matching
  bhps_only_gmm_ph_*.json must conform to the bhps-nonoverlap-output schema,
  ensuring the ARI, persistence headline, and pre-registered decision are present.

spec_citation:
  source: "P01-A response plan section S10; Spec 'BHPS overlap / replication reframing'; T1.26 pre-registration 2026-06-08"
  vault_entry_date: "2026-06-08"

output_validation:
  applies_to_glob: "results/panel_methodology/bhps_nonoverlap/bhps_only_gmm_ph_*.json"
  schema_contracts:
    - bhps-nonoverlap-output

binding:
  test_file: "tests/panel/test_bhps_nonoverlap_contracts.py"
  test_function: "test_bhps_nonoverlap_json_validation_dispatch"
  must_assert: >
    Every staged JSON matching
    results/panel_methodology/bhps_nonoverlap/bhps_only_gmm_ph_*.json is
    dispatched to the bhps-nonoverlap-output schema; non-matching bhps_nonoverlap
    JSONs are not accidentally captured.
