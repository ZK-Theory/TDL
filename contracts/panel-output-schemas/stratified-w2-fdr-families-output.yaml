id: stratified-w2-fdr-families-output
kind: schema
pending: true

description: >
  Schema for the T1.28 per-family FDR JSON
  (results/panel_methodology/fdr/stratified_w2_bh_per_family_<date>.json). The 12
  per-subgroup stratified W2 tests (per dataset) are corrected within three
  SEPARATE families by demographic axis — NOT pooled into one family as in v1:
  Benjamini-Hochberg within gender (2 tests), within NS-SEC (3 tests), and within
  cohort (7 tests). All three families use BH: the per-subgroup-vs-own-Markov-1-null
  tests run on DISJOINT subgroups and are mutually independent, so the cohort family
  does not need the Benjamini-Yekutieli positive-dependence adjustment (that
  rationale applied only to the retired pairwise-between-subgroup model, where
  adjacent cohorts shared panel observations). Every adjusted p MUST sit beside its
  retained effect size (T_ratio + BCa CI) so the FDR correction never strips the
  magnitude needed for the §6.1 table. Enforced per dataset (usoc and bhps).

spec_citation:
  source: "P01-A response plan ISSUE B8 (per-family FDR); T1.28 re-scope pre-registration results/panel_methodology/fdr/pre_registrations_2026-06-13.json + 2026-06-27 amendment (per-subgroup model, 2/3/7 subgroups, BH per family); Benjamini & Hochberg (1995)"
  anchor: "results/panel_methodology/fdr/stratified_w2_bh_per_family_<date>.json"
  vault_entry_date: "2026-06-27"

schema_def:
  applies_to: "JSON files matching results/panel_methodology/fdr/stratified_w2_bh_per_family_*.json"
  required_keys:
    - name: schema_version
      type: str
      description: "Schema version tag, MUST be 'stratified-w2-fdr-families-v1'."
    - name: generated_at
      type: str
      description: "ISO date matching the output filename."
    - name: pre_registration
      type: str
      description: "MUST reference the 2026-06-13 T1.28 pre-registration AND its 2026-06-27 per-subgroup amendment."
    - name: datasets
      type: "dict[str, ...]"
      description: >
        MUST contain exactly keys 'usoc' and 'bhps'. Each dataset is a dict with a
        'families' dict containing exactly gender, nssec, cohort. families.gender.method
        == 'BH' (n_tests == 2); families.nssec.method == 'BH' (n_tests == 3);
        families.cohort.method == 'BH' (n_tests == 7). Each family carries a tests list
        whose every item has subgroup_id (str), raw_p (float in [0,1]), adjusted_p
        (float in [0,1], adjusted_p >= raw_p), rejected (bool), t_ratio (float) and
        bca_ci (two ordered finite floats) — the effect size retained beside the
        corrected p.
  conditional_keys: []
  forbidden_keys:
    - name: pooled_single_family
      reason: "v1 pooled all stratification tests into one family; the v2 correction MUST use three separate per-axis families, each Benjamini-Hochberg."
    - name: bonferroni
      reason: "The pre-registered correction is BH per family, not Bonferroni; presence signals a divergent method."

binding:
  test_file: "tests/panel/test_t1_28_stratified_w2_contracts.py"
  test_function: "test_stratified_w2_fdr_families_output_schema"
  must_assert: >
    The validator accepts a conforming per-family FDR payload and rejects payloads where
    (a) schema_version is not 'stratified-w2-fdr-families-v1';
    (b) datasets does not contain exactly usoc and bhps;
    (c) a dataset's families does not contain exactly gender, nssec, cohort;
    (d) any of families.gender.method, families.nssec.method, families.cohort.method != 'BH';
    (e) family n_tests are not gender==2, nssec==3, cohort==7;
    (f) any raw_p or adjusted_p is outside [0,1], or adjusted_p < raw_p for any test;
    (g) a tests[] item drops its effect size (missing t_ratio or bca_ci, or bca_ci unordered); or
    (h) any forbidden key (pooled_single_family, bonferroni) is present.
