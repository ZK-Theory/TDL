id: tier2-svyglm-headline-output
kind: schema
pending: true

description: >
  Schema for the T1.34a fallback (Option A) Tier-2 headline JSON written to
  results/panel_methodology/regression/tier2_svyglm_headline_*.json. After
  the weighted household-RE glmmTMB (and the WeMix survey pseudo-likelihood
  alternative) were both found non-estimable on the singleton-dominated
  household structure (2026-06-03 resolution amendment), the design-based
  svyglm fit (normalised IPW, cluster-robust SE) becomes the IPW-adjusted
  headline, with the stable unweighted household-RE GLMM reported as the
  random-effects/ICC companion and the weighted household random-effect
  variance reported as NOT reliably estimable. The schema requires the
  svyglm coefficient column, the unweighted-GLMM companion block, the
  household-variance non-estimability flag with rationale, and the
  acceptance fields, and it FORBIDS reporting a weighted household ICC as
  a finding.

spec_citation:
  source: "Resolution amendment [DECISION] 2026-06-03 (T1.34a Option A fallback); Plan Task 1.34; svyglm-cluster-robust-se, rubin-pooling, normalised-ipw-trimming formula contracts"
  vault_entry_date: "2026-06-03"

schema_def:
  applies_to: "JSON files matching results/panel_methodology/regression/tier2_svyglm_headline_*.json"
  required_keys:
    - name: schema_version
      type: str
      description: "Schema version tag, MUST be 'panel-output/tier2-svyglm-headline/v1'."
    - name: generated_at
      type: str
      description: "ISO 8601 timestamp."
    - name: task
      type: str
      description: "Task identifier, MUST be 'T1.34a svyglm headline (Option A fallback)'."
    - name: pre_registration
      type: str
      description: "Governing entry, MUST reference the 2026-06-03 resolution amendment."
    - name: params
      type: "dict[str, ...]"
      description: "Provenance block. MUST contain: m_imputations (int == 20), engine_headline (str == 'survey::svyglm'), family (str == 'quasibinomial'), design_ids (str == '~foo_cluster' or '~hh_group' — the cluster id declared in svydesign), ipw_source (str, path to the T1.13 normalised IPW RDS), ipw_trimming (str == 'p1/p99 of raw, per-stratum normalisation to mean 1'), model_formula_fixed (str), conditioning_sample (str == 'first-window regime in {R2, R6}'), escape_definition_source (str, path to window_escape_assignments_2026-05-14.json), seed (int == 42), n_obs (int), n_clusters (int)."
    - name: convergence
      type: "dict[str, ...]"
      description: "MICE convergence diagnostics per the mice-convergence-rule invariant. MUST contain: all_chains_converged (bool == true; if false the JSON should not have been produced), per_chain_trace_passed (list[bool] of length m), rhat_summary (dict[str, float])."
    - name: svyglm_headline
      type: "list[dict]"
      description: "Per-coefficient headline rows (Rubin-pooled across m svyglm fits). Each row MUST contain: name (str), level (str if categorical else null), estimate (float), cluster_robust_se (float >= 0), pvalue (float in [0, 1]), rubin_df (float > 0), rubin_fmi (float in [0, 1])."
    - name: unweighted_glmm_companion
      type: "dict[str, ...]"
      description: "Companion random-effects reference (stable unweighted household-RE GLMM). MUST contain: regime_init_r6_logor (float), sigma_u_hh (float >= 0), icc_hh (float in [0, 1]), coefficients (list[dict] with name/level/estimate/se/pvalue). This is the ONLY place a household ICC may appear, explicitly labelled as the unweighted reference, NOT the IPW-adjusted headline."
    - name: household_variance_estimability
      type: "dict[str, ...]"
      description: "Honest non-estimability record. MUST contain: weighted_household_variance_estimable (bool == false), rationale (str — singleton-dominated household structure; ~6,037 households / ~7,097 individuals), evidence (list[str] — references to the WeMix 'Matrix seems negative semi-definite' failure and the weighted glmmTMB ICC->0.997 divergence)."
    - name: acceptance
      type: "dict[str, ...]"
      description: "Pre-registered acceptance gate. MUST contain: regime6_or_gt_1 (bool — true iff the svyglm regime_6 odds ratio > 1), nssec_direction_consistent_with_t120 (bool — true iff NS-SEC coefficient signs match the T1.20 Tier-2 baseline tier2_glmm_firth_2026-05-14.json), accepted (bool == regime6_or_gt_1 AND nssec_direction_consistent_with_t120)."
  forbidden_keys:
    - name: weighted_household_icc
      reason: "The weighted household random-effect variance is non-estimable on this structure; reporting a weighted household ICC as a finding is forbidden. The only household ICC permitted is the explicitly-labelled unweighted companion under unweighted_glmm_companion."
    - name: wemix_headline
      reason: "WeMix is non-estimable here (negative semi-definite, >1h/imputation); a WeMix fit must not be presented as the headline."

binding:
  test_file: "tests/panel/test_t134_regression_contracts.py"
  test_function: "test_tier2_svyglm_headline_json_schema"
  must_assert: >
    A synthetic JSON conforming to this schema validates. JSONs with (a)
    params.m_imputations != 20, (b) params.engine_headline != 'survey::svyglm'
    or family != 'quasibinomial', (c) any svyglm_headline row missing
    cluster_robust_se or with pvalue outside [0, 1], (d)
    household_variance_estimability.weighted_household_variance_estimable
    != false, (e) icc_hh in the companion block outside [0, 1], (f)
    acceptance.accepted not equal to (regime6_or_gt_1 AND
    nssec_direction_consistent_with_t120), or (g) presence of either
    forbidden key (weighted_household_icc, wemix_headline) are rejected
    with a precise diagnostic.
