id: nssec-regime-crosstab-output
kind: schema
pending: true

description: >
  Schema for the T1.34 parental NS-SEC x first-window regime descriptive
  cross-tab JSON written to results/panel_methodology/regression/. The
  schema fixes the counts matrix, the row and column proportion matrices,
  the sparse_cells list (per the cross-tab-sparse-cell-flagging invariant),
  and the conditioning sample description. The §S8 narrative reads from
  this JSON; the schema ensures that what the prose cites exists as a
  structured field, not as a derived computation.

spec_citation:
  source: "Plan Task 1.34 Output block + cross-tab-sparse-cell-flagging invariant"
  vault_entry_date: "2026-05-25"

schema_def:
  applies_to: "JSON files matching results/panel_methodology/regression/nssec_regime_crosstab_*.json"
  required_keys:
    - name: schema_version
      type: str
      description: "Schema version tag, MUST be 'panel-output/nssec-regime-crosstab/v1'."
    - name: generated_at
      type: str
      description: "ISO 8601 timestamp."
    - name: task
      type: str
      description: "Task identifier, MUST be 'T1.34 NSSEC x regime cross-tab'."
    - name: params
      type: "dict[str, ...]"
      description: "Provenance block. MUST contain: nssec_proxy_source (str, e.g. 'T1.18 sibling-consistent MICE pool, complete-case'), regime_init_source (str, e.g. 'first-window placement from run_priority2.py'), nssec_levels (list[str], ordered), regime_levels (list[str], ordered with values in {'R2', 'R6'}), n_total (int), n_missing_nssec (int), n_missing_regime (int)."
    - name: counts
      type: "list[list[int]]"
      description: "2-D counts matrix indexed [nssec_level_idx][regime_level_idx]. All entries are non-negative integers. No silent rounding or aggregation."
    - name: row_proportions
      type: "list[list[float]]"
      description: "Row-conditional proportions: counts[i][j] / sum_j(counts[i][:]); each row sums to 1.0 within float tolerance (or to 0.0 if the row total is 0)."
    - name: col_proportions
      type: "list[list[float]]"
      description: "Column-conditional proportions: counts[i][j] / sum_i(counts[:][j]); each column sums to 1.0 within float tolerance."
    - name: sparse_cells
      type: "list[dict]"
      description: "Per cross-tab-sparse-cell-flagging invariant. Each entry is a dict with keys nssec_level (str), regime_level (str), count (int in {0, 1, 2, 3, 4}), row_index (int), col_index (int). The key MUST be present even if empty."
    - name: column_independence_test
      type: "dict[str, ...]"
      description: "Chi-square test of independence between rows and columns. MUST contain: statistic (float >= 0), df (int > 0), pvalue (float in [0, 1]), expected_min (float, the minimum expected cell count under independence — values < 5 invalidate the chi-square asymptotic). If expected_min < 5, the JSON additionally records fisher_exact (dict with statistic / pvalue)."
  forbidden_keys:
    - name: aggregated_other_row
      reason: "Aggregating sparse rows into an 'other' category is forbidden at the JSON layer. Any such aggregation is a downstream paper-table rendering concern, NOT a data-layer transformation."

binding:
  test_file: "tests/panel/test_t134_regression_contracts.py"
  test_function: "test_nssec_regime_crosstab_json_schema"
  must_assert: >
    A synthetic JSON conforming to this schema validates. JSONs with (a)
    counts containing a non-integer or negative value, (b) row_proportions
    not summing to 1 within tolerance for non-zero-total rows, (c)
    sparse_cells missing a cell that has count < 5, (d) sparse_cells
    incorrectly flagging a cell with count >= 5, or (e) presence of the
    forbidden aggregated_other_row key are rejected with a precise diagnostic.
