id: rubin-pooling
kind: formula
pending: false

description: >
  Rubin's rules for pooling estimates and variance across m multiple
  imputations. Implements the canonical Q-bar combined estimate, the
  within-imputation variance U-bar, the between-imputation variance B, the
  total variance T = U-bar + (1 + 1/m) B, the Barnard-Rubin degrees of
  freedom, and the fraction of missing information (FMI). Required for
  T1.34's Tier-2 GLMM with m = 20 NS-SEC proxy imputations; using only the
  Q-bar without the variance correction or using the wrong T formula
  underestimates standard errors and inflates type-I error.

spec_citation:
  source: "Rubin (1987) Multiple Imputation for Nonresponse in Surveys; Barnard & Rubin (1999) for finite-sample df adjustment; Plan Task 1.34 Validation block"
  vault_entry_date: "2026-05-25"

formula:
  expression: "Q_bar = (1/m) * sum_i(Q_i); U_bar = (1/m) * sum_i(U_i); B = (1/(m-1)) * sum_i((Q_i - Q_bar)^2); T = U_bar + (1 + 1/m) * B; df = (m - 1) * (1 + U_bar / ((1 + 1/m) * B))^2; FMI = (1 + 1/m) * B / T"
  variables:
    m:
      description: "Number of multiple imputations. T1.34 locks m = 20 per Spec."
      domain: "positive integer; m = 20 for T1.34"
      implementation_name: "m"
    Q_i:
      description: "Point estimate (e.g., a regression coefficient) from the i-th imputation, i in {1, ..., m}."
      domain: "real"
      implementation_name: "estimates[i]"
    U_i:
      description: "Within-imputation variance estimate of Q_i."
      domain: "non-negative real"
      implementation_name: "variances[i]"
    Q_bar:
      description: "Combined point estimate: simple mean across the m imputations."
      domain: "real"
      implementation_name: "pooled_estimate"
    U_bar:
      description: "Average within-imputation variance."
      domain: "non-negative real"
      implementation_name: "within_imputation_variance"
    B:
      description: "Between-imputation variance: unbiased sample variance of Q_i values across imputations."
      domain: "non-negative real"
      implementation_name: "between_imputation_variance"
    T:
      description: "Total variance for Rubin-pooled inference: U_bar + (1 + 1/m) * B. The 1 + 1/m factor accounts for finite-m simulation noise."
      domain: "non-negative real"
      implementation_name: "total_variance"
    df:
      description: "Barnard-Rubin degrees of freedom for the pooled t-statistic. The simpler Rubin-1987 df = (m - 1) * (1 + r)^2 with r = U_bar / ((1 + 1/m) B) is acceptable; Barnard-Rubin-1999 finite-sample correction is preferred when sample df is small."
      domain: "positive real"
      implementation_name: "df_rubin"
    FMI:
      description: "Fraction of missing information: the share of the total variance attributable to between-imputation variation."
      domain: "[0, 1]"
      implementation_name: "fmi"
  invariants:
    - claim: "T = U_bar + (1 + 1/m) B (NOT T = U_bar + B). The (1 + 1/m) factor is mandatory; omitting it underestimates SE."
      expression: "T == U_bar + (1 + 1/m) * B"
    - claim: "FMI is in [0, 1]; values approaching 1 indicate the imputation model contributes most of the total uncertainty."
      expression: "0 <= FMI <= 1"
    - claim: "B uses (m - 1) divisor (unbiased sample variance), NOT m."
      expression: "B == sum((Q_i - Q_bar)^2) / (m - 1)"
    - claim: "df is computed from the pooled variance ratio; a fixed large df (e.g., Inf or m * 100) is forbidden."
    - claim: "Pooled SE is sqrt(T), not sqrt(U_bar)."
    - claim: "The pooled p-value uses the t-distribution with df degrees of freedom (NOT the Normal distribution unless df is very large)."
    - claim: "When m = 20, df should be well-defined and finite for all coefficients with non-zero between-imputation variance."

binding:
  test_file: "tests/panel/test_t134_regression_contracts.py"
  test_function: "test_rubin_pooling_formula"
  must_assert: >
    On synthetic per-imputation estimates Q = [1.0, 1.2, 0.8, 1.1, 0.9] and
    within-variances U = [0.04, 0.05, 0.04, 0.045, 0.05] with m = 5 (a small
    test case): (a) Q_bar == mean(Q) within float tolerance; (b) U_bar ==
    mean(U); (c) B == sample variance of Q (denominator m - 1 = 4);
    (d) T == U_bar + (1 + 1/5) * B; (e) FMI == (1 + 1/5) * B / T; (f) FMI
    is in [0, 1]; (g) df is finite and positive; (h) the pooled SE equals
    sqrt(T), NOT sqrt(U_bar). A test variant with B = 0 (no between-imputation
    variance) returns FMI = 0 and T = U_bar.
