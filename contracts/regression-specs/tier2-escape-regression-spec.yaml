id: tier2-escape-regression-spec
kind: formula
pending: true

description: >
  The Tier-2 escape regression for T1.34 supersedes the abandoned Tier-3
  cross-classified specification (T1.21 superseded by Spec amendment 2026-05-25).
  It is a logistic GLMM with a single household random intercept fit on the
  R2/R6 disadvantaged-starters sample, conditioning on the same fixed-effect
  covariates as T1.20 (the previous Tier-2 run at commit 0ae5398). The model
  formula, the random-effect structure, the conditioning sample, the
  estimation engine, and the response definition are all pinned: a Worker
  cannot substitute a marginal logit, a random-slope, or a different starting
  sample without breaking the contract.

spec_citation:
  source: "Plan Task 1.34 'Regression refit' Guidance block; Spec amendment 2026-05-25 (T1.21 supersession); T1.20 reference run commit 0ae5398"
  vault_entry_date: "2026-05-25"

formula:
  expression: "logit(P(escape_i == 1)) = beta_0 + beta_regime * regime_init_i + beta_nssec * nssec_proxy_i + beta_cohort * birth_cohort_i + beta_sex * sex_i + beta_region * region_i + u_hh(i); u_hh ~ N(0, sigma_u^2)"
  variables:
    escape_i:
      description: "Binary escape outcome for individual i, derived per the locked window-based escape definition in run_priority2.py and window_escape_assignments_2026-05-14.json. escape = 1 iff first observation window has individual in R2 or R6 AND a subsequent observation window has the individual in {R1, R4} (GOOD_REGIMES = {1, 4} per the 2026-05-14 T1.19-rerun fix)."
      domain: "{0, 1}"
      implementation_name: "escape"
    regime_init_i:
      description: "Initial regime placement: R2 or R6 (factor with two levels). The analytical sample is conditioned on first-window regime in {R2, R6} so this is the treatment-of-interest variable."
      domain: "factor in {'R2', 'R6'}"
      implementation_name: "regime_init"
    nssec_proxy_i:
      description: "Parental NS-SEC proxy from the T1.18 sibling-consistent MICE pool over m = 20 imputations. Hierarchy: father (pasoc90_cc) then mother (masoc90_cc) when father missing."
      domain: "factor (NS-SEC categorical)"
      implementation_name: "nssec_proxy"
    birth_cohort_i:
      description: "Birth-cohort group from the locked T1.13 IPW propensity model categorisation."
      domain: "categorical"
      implementation_name: "birth_cohort"
    sex_i:
      description: "Sex (factor)."
      domain: "{'M', 'F'}"
      implementation_name: "sex"
    region_i:
      description: "Region of residence at baseline."
      domain: "categorical"
      implementation_name: "region"
    u_hh:
      description: "Household random intercept (one per hh_group cluster), drawn from a Gaussian with variance sigma_u^2."
      domain: "real"
      implementation_name: "(1 | hh_group)"
    sigma_u:
      description: "Household-level random-intercept standard deviation."
      domain: "non-negative real"
      implementation_name: "sigma_u"
  invariants:
    - claim: "Estimation engine is glmmTMB with family = binomial(link = 'logit'). lme4::glmer is forbidden for this contract because the T1.20 IPW-weighted spec uses glmmTMB's weights handling."
    - claim: "Analytical sample is first-window R2/R6 starters (the conditional escape sample), NOT the full N analytical population. n_starters expected ~7,453; complete-case n with NS-SEC proxy expected ~6,173 per T1.18 ESC-2 Option B."
    - claim: "Response is the window-based escape indicator from window_escape_assignments_2026-05-14.json (NOT 'last observed jbstat in E'; NOT 'any wave not in R2/R6'). GOOD_REGIMES = {1, 4}."
    - claim: "Random structure is single random intercept on hh_group (household). No random slope, no nested grouping, no cross-classified grouping (Tier-3 was structurally non-estimable on this sample per T1.21 superseded result)."
    - claim: "Normalised IPW weights from T1.13 (with p1/p99 trimming per normalised-ipw-trimming contract) are passed as the weights argument to glmmTMB."
    - claim: "Fixed-effect direction sanity: beta_regime (R6 vs R2) MUST be positive (R6 starters more likely to escape) and consistent with T1.20 reference (regime_6 OR ~ 21.3). A reversed sign indicates a data-assembly defect, not a real finding."
    - claim: "MICE m = 20 imputations are pooled via Rubin's rules per the rubin-pooling contract; no single-imputation fit is permitted as the headline."

binding:
  test_file: "tests/panel/test_t134_regression_contracts.py"
  test_function: "test_tier2_escape_regression_spec"
  must_assert: >
    On a small synthetic R2/R6-starter sample (e.g., n = 200 with simulated
    household clustering and known beta_regime direction): (a) the fitted
    model uses glmmTMB with family = binomial; (b) the random structure is
    exactly (1 | hh_group) with no other random terms; (c) the analytical
    sample is restricted to first-window regime in {R2, R6}; (d) the
    escape indicator is read from the window-based source, not from a
    'last jbstat' computation; (e) weights from a synthetic IPW vector are
    routed through glmmTMB's weights argument; (f) attempting to fit on the
    full sample (no R2/R6 conditioning) is rejected with a precise
    diagnostic; (g) attempting to add a random slope or a cross-classified
    grouping is rejected.
