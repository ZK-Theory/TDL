id: mice-convergence-rule
kind: invariant
pending: false

description: >
  Behavioural invariant for T1.34's m = 20 MICE imputations of the NS-SEC
  proxy. Rubin pooling is permitted ONLY if every chain has converged per
  the trace / R-hat diagnostic. A chain that did not converge contributes
  estimates that violate the iid assumption underlying Rubin's rules,
  inflating between-imputation variance with simulation noise rather than
  true imputation uncertainty. Silently pooling all m chains regardless of
  convergence is forbidden; the contract surfaces non-convergence as a
  failure state, not a warning to be discarded.

spec_citation:
  source: "van Buuren (2018) Flexible Imputation of Data Ch. 4.5; Plan Task 1.34 Validation block; T1.18 sibling-consistent MICE convergence rename (2026-05-16 [PIPELINE])"
  vault_entry_date: "2026-05-16"

invariant:
  claim: >
    Before computing the pooled estimate via the rubin-pooling contract,
    the T1.34 driver MUST verify that every one of the m = 20 imputation
    chains has converged. Convergence is defined as (a) the per-chain trace
    plot of the imputed variable's mean and standard deviation does not
    show a long-run drift across the last half of the iterations, AND
    (b) when multiple parallel chains are run for diagnostic purposes,
    the between-chain R-hat (Gelman-Rubin) statistic for the imputed
    variable's summary statistics is <= 1.1. If any chain fails either
    criterion, the driver MUST raise an error with a diagnostic naming the
    failing chain(s) and the diagnostic value, and MUST NOT proceed to
    Rubin pooling.
  preconditions:
    - "m = 20 imputation chains have been generated by the MICE engine."
    - "The trace data (per-iteration mean and SD of the imputed variable per chain) and the R-hat diagnostic are available."
  counter_example_history: >
    The 2026-05-16 T1.18 [PIPELINE] entry renamed the MICE convergence
    diagnostic in nssec_sibling_mice.R because the prior name was
    ambiguous about which chain it described. T1.34 must not regress to
    silently pooling unconverged chains by routing around the renamed
    diagnostic.

binding:
  test_file: "tests/panel/test_t134_regression_contracts.py"
  test_function: "test_mice_convergence_rule_blocks_pooling_on_failure"
  must_assert: >
    On a synthetic MICE output with m = 3 chains where chain 2 has been
    constructed to fail the trace-drift criterion (e.g., a monotone drift
    of the imputed variable mean across the last half of iterations): the
    T1.34 driver raises an error naming chain 2 and does NOT call the
    Rubin pooling function. A second test variant with all three chains
    converged proceeds to pooling normally. The error message contains
    enough provenance (chain index, diagnostic name, diagnostic value) for
    the Manager to triage without re-running the chains.
