id: w2-gap-closure-convention-gate
kind: invariant
pending: false

description: >
  A reproduction or convention gate only has power if at least one side of its
  comparison is freshly recomputed through the code path under test. A gate that
  reads a value from artifact X and compares it to artifact X is self-referential,
  passes unconditionally, and verifies nothing except that the copy succeeded.
  This invariant forces the T1.38 gate to re-derive: the greedy replica must
  reproduce the committed value through the fresh path (establishing which
  convention produced the artifact), and the exact value must be computed fresh
  from the same cache — never read from any committed artifact.

spec_citation:
  source: >
    T1.38 pre-registration 2026-07-15; SUPERSEDED.md solver-artifact axis;
    permanent note silent-absence-is-the-failure-mode-that-produces-no-error.
    Authored after a vacuous PASS carried an entire wrong conclusion.
  vault_entry_date: "2026-07-15"

invariant:
  claim: >
    For every committed value T1.38 re-derives, the convention gate places a
    FRESHLY RECOMPUTED number on at least one side of the equals sign.
    Specifically: (a) the greedy replica, executed over the cached diagrams
    through the fresh code path, reproduces the committed value within tol —
    establishing convention identity by artifact rather than by date; AND (b)
    the exact value is computed fresh from those same cached diagrams and is
    never read, copied, or carried forward from a committed artifact. A gate
    whose reference side originates in the artifact under test FAILS. The gate
    result is recorded BEFORE any dependent or downstream value.
  preconditions:
    - "a diagram cache exists for the object under test"
    - "the committed value being reproduced is named with its file and JSON path"
    - "convention_gate.reference_freshly_recomputed is true in the emitted payload"
  counter_example_history: >
    WT-1, 2026-07-12. The run's sanity cross-check (05_assemble_result.py)
    compared usoc_w2_data["committed_orphan_stats"] against the committed
    headline JSON and reported PASS — but committed_orphan_stats had been copied
    verbatim from that same JSON one step earlier by 03_..._w2_headline.py. It
    compared the committed values against themselves: trivially true,
    re-deriving nothing. The memo's whole (wrong) conclusion rode on that
    vacuous PASS — it assumed the committed 233.68 was exact and flagged the
    fresh exact 12.71 as the defect, inverting the diagnosis. Had the gate
    recomputed the orphan headline through the fresh path it would have produced
    ~12.4 against the committed 233.68 and exposed the greedy-vs-exact gap
    immediately. Where no cache exists, the honest verdict is UNVERIFIABLE:
    never date an environment from a lockfile, which records when something
    became guaranteed, never when it became present.

binding:
  test_file: "tests/trajectory_tda/test_w2_gap_closure_contracts.py"
  test_function: "test_w2_gap_closure_convention_gate_invariant"
  must_assert: >
    Asserts that (a) a payload with convention_gate.reference_freshly_recomputed
    false is rejected; (b) a gate whose greedy replica reproduces a known
    greedy-era committed value within tol yields
    greedy_replica_reproduces_committed true and absdiff <= tol; (c) the
    NEGATIVE CONTROL — a self-referential gate, where the reference is copied
    from the artifact under test, is detected and rejected rather than passing
    (the check must be demonstrated capable of failing, not assumed to work);
    (d) equality between an exact value and a committed greedy value is not itself
    a failure: the test uses a fixture with independently established non-optimal
    greedy assignment to detect fallback behavior; and (e) a payload declaring a gate verdict with absdiff absent, or
    tol <= 0, is rejected.
