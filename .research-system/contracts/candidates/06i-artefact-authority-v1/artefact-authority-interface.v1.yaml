      command_type: RegisterArtefact
      ordered_events: [ArtefactRegistered]
      reducers: [reduce_artefact]
      projections: [artefact]
      projection_selector: null
      authority:
        rule_and_precondition: immutable content hash and complete manifest provenance
        authority_subject_kind: artefact
        authority_subject_id_source: payload.new_artefact_id
        authority_scope_source: [envelope.project_id, authority_subject_kind, authority_subject_id_source]
        authority_grant_id_source: envelope.authority_grant_id
        authority_effective_at_source: authority_grant.effective_at
        authority_expires_at_source: authority_grant.expires_at
        allowed_actor_classes: [human, agent, service]
        prohibited_actor_classes: [importer]
      receipt: R
      positive_test: pos_artefact_register
      negative_profile: NA
      expanded_negative_tests:
        - neg_artefact_register_missing_field
        - neg_artefact_register_wrong_type
        - neg_artefact_register_missing_authority
        - neg_artefact_register_wrong_authority
        - neg_artefact_register_expired_grant
        - neg_artefact_register_not_yet_effective_grant
        - neg_artefact_register_prohibited_actor
        - neg_artefact_register_wrong_authority_scope
        - neg_artefact_register_wrong_authority_subject_kind
        - neg_artefact_register_wrong_authority_subject_id
        - neg_artefact_register_stale_expected_version
        - neg_artefact_register_conflicting_payload
        - neg_artefact_register_idempotency_conflict
        - neg_artefact_register_atomic_no_event
        - neg_artefact_register_atomic_no_receipt_acceptance
        - neg_artefact_register_atomic_no_projection_side_effect
        - neg_artefact_register_illegal_from_state
        - neg_artefact_register_illegal_to_state
        - neg_artefact_register_invalid_command_subject_identity
        - neg_artefact_register_authority_rule_mutation
        - neg_artefact_register_accepted_subject_binding_mutation
        - neg_artefact_register_allowed_actor_class_mutation
      complete_record_sha256: 0b6eadd054aac60b8661747c74a2e92631d7b41b3199d65d8c0716a8c0cc9ff7
    initial_use_authority: candidate
    atomic_failure_contract: &atomic_command_failure
      validation_order:
