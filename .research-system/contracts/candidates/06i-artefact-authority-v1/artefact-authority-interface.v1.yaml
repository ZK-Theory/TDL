        prohibited_actor_classes: [importer]
      receipt: R
      positive_test: pos_artefact_scientific_review
      negative_profile: NI
      expanded_negative_tests:
        - neg_artefact_scientific_review_missing_field
        - neg_artefact_scientific_review_wrong_type
        - neg_artefact_scientific_review_missing_authority
        - neg_artefact_scientific_review_wrong_authority
        - neg_artefact_scientific_review_expired_grant
        - neg_artefact_scientific_review_not_yet_effective_grant
        - neg_artefact_scientific_review_prohibited_actor
        - neg_artefact_scientific_review_wrong_authority_scope
        - neg_artefact_scientific_review_wrong_authority_subject_kind
        - neg_artefact_scientific_review_wrong_authority_subject_id
        - neg_artefact_scientific_review_stale_expected_version
        - neg_artefact_scientific_review_conflicting_payload
        - neg_artefact_scientific_review_idempotency_conflict
        - neg_artefact_scientific_review_atomic_no_event
        - neg_artefact_scientific_review_atomic_no_receipt_acceptance
        - neg_artefact_scientific_review_atomic_no_projection_side_effect
        - neg_artefact_scientific_review_illegal_from_state
        - neg_artefact_scientific_review_illegal_to_state
        - neg_artefact_scientific_review_invalid_command_subject_identity
        - neg_artefact_scientific_review_authority_rule_mutation
        - neg_artefact_scientific_review_accepted_subject_binding_mutation
        - neg_artefact_scientific_review_allowed_actor_class_mutation
        - neg_artefact_scientific_review_stale_subject_hash
        - neg_artefact_scientific_review_ineligible_reviewer
        - neg_artefact_scientific_review_self_related_reviewer
        - neg_artefact_scientific_review_insufficient_independence_grade
        - neg_artefact_scientific_review_incomplete_governing_review_set
      complete_record_sha256: e32c3fc7c7d1d456ba62bbc4011120a944b9c404f9d306d69543ea04f5c0752d
    atomic_failure_contract: *atomic_command_failure
  - catalogue_key: artefact.use_authority
    owner_catalogue_binding:
      command_type: SetArtefactUseAuthority
      ordered_events: [ArtefactUseAuthoritySet]
      reducers: [reduce_artefact]
      projections: [artefact, governance]
      projection_selector: null
      authority:
        rule_and_precondition: consumer predicate over all six dimensions
