      complete_record_sha256: 1617a904037563d280a73c9a504ef6e96c2b17338776b46a1e9adbc9efce4332
    atomic_failure_contract: *atomic_command_failure
  - catalogue_key: decision.resolve
    owner_catalogue_binding:
      command_type: ResolveDecision
      ordered_events: [DecisionResolved]
      reducers: [reduce_decision]
      projections: [decision, governance]
      projection_selector: null
      authority:
        rule_and_precondition: reserved deciding authority; exact evidence/reviews
        authority_subject_kind: decision
        authority_subject_id_source: envelope.target_stream_id
        authority_scope_source: [envelope.project_id, authority_subject_kind, authority_subject_id_source]
        authority_grant_id_source: envelope.authority_grant_id
        authority_effective_at_source: authority_grant.effective_at
        authority_expires_at_source: authority_grant.expires_at
