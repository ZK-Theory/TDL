        - neg_artefact_use_authority_missing_field
        - neg_artefact_use_authority_wrong_type
        - neg_artefact_use_authority_missing_authority
        - neg_artefact_use_authority_wrong_authority
        - neg_artefact_use_authority_expired_grant
        - neg_artefact_use_authority_not_yet_effective_grant
        - neg_artefact_use_authority_prohibited_actor
        - neg_artefact_use_authority_wrong_authority_scope
        - neg_artefact_use_authority_wrong_authority_subject_kind
        - neg_artefact_use_authority_wrong_authority_subject_id
        - neg_artefact_use_authority_stale_expected_version
        - neg_artefact_use_authority_conflicting_payload
        - neg_artefact_use_authority_idempotency_conflict
