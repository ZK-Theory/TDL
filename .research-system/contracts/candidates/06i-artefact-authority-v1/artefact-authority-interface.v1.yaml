        - authority_grant_actor_scope_and_effectivity
        - current_state_expected_version_and_idempotency
        - bound_evidence_and_domain_preconditions
        - writer_lock_recheck
        - durable_mutation
      failure_exception: typed_command_rejection
      rejected_receipt: permitted_if_typed_and_not_accepted
      accepted_receipt: none
      event_append: none
      object_revision: none
      projection_mutation: none
  - catalogue_key: artefact.scientific_review
    owner_catalogue_binding:
      command_type: RecordScientificReview
      ordered_events: [ScientificReviewRecorded]
      reducers: [reduce_artefact]
      projections: [artefact, review]
      projection_selector: null
      authority:
        rule_and_precondition: eligible review bound to exact subject hash
        authority_subject_kind: artefact
        authority_subject_id_source: envelope.target_stream_id
        authority_scope_source: [envelope.project_id, authority_subject_kind, authority_subject_id_source]
        authority_grant_id_source: envelope.authority_grant_id
