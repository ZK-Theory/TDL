- {decision_id: proposal_decision/numeric_policy_bounds, family_ref: family/resource_operation, selection_kind: generation_rule, selected_rule: "All integer primitives use the interoperable maximum 9007199254740991; units remain those stated by each field name and source fact. For every ResourceRequest, runtime_distribution.minimum_seconds <= runtime_distribution.expected_seconds <= runtime_distribution.maximum_seconds and resource_ceilings.ram_working_bytes <= resource_ceilings.ram_peak_bytes. No universal resource or duration maximum is generated beyond W2 §7.1's interoperable integer maximum; selected operational-profile policy supplies any narrower ceiling.", generator_byte_change_allowed: false, source_citation: W2 §7.1 and W8 §7 requests state ranges and estimates; W8 §11.1 no universal duration default, decision_basis: conservative_proposal}
