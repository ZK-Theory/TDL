- {decision_id: proposal_decision/schema_id_scope, family_ref: family/correction, selection_kind: generation_rule, selected_rule: "Generate one identity for each of 87 command and 86 event semantic types; repeated owner rows share that semantic identity and closed variants remain inside it.", generator_byte_change_allowed: false, source_citation: 06d §1.1, decision_basis: conservative_proposal}
- {decision_id: proposal_decision/shared_discriminators, family_ref: family/task, selection_kind: generation_rule, selected_rule: "Freeze every discriminator_field and variant_const_values entry in shared_schema_rules; generation may neither rename nor infer them.", generator_byte_change_allowed: false, source_citation: 06d §1.3 repeated semantic types, decision_basis: conservative_proposal}
- {decision_id: proposal_decision/retention_and_sensitivity, family_ref: family/artefact, selection_kind: runtime_policy_gate, selected_rule: "Retention, sensitivity, provenance-class, and destination-class strings are institutional classifications supplied only through a separately versioned runtime policy; schema generation cannot invent values.", generator_byte_change_allowed: false, source_citation: W2 §16 and W8 §§7 and 18-20, decision_basis: conservative_proposal}
- {decision_id: proposal_decision/recovery_external_availability, family_ref: family/backup_recovery, selection_kind: generation_rule, selected_rule: "Generate one closed external_artefacts array field whose entries are object/external_artefact_availability. Each entry is an immutable artefact_id plus content_sha256 reference with an exact availability and non-empty availability_evidence_refs. The generator must enforce unique (artefact_id, content_sha256) entries, complete manifest coverage exactly once, and writer-lease eligibility only when every entry is available with evidence; missing, inaccessible, quarantined, missing evidence, incomplete coverage, or partial restore generates diagnostic-only/no-writer-lease behavior.", generator_byte_change_allowed: false, source_citation: W8 §§19-21 and 06d operator backup rows, decision_basis: conservative_proposal}
- {decision_id: proposal_decision/correction_subject_union, family_ref: family/correction, selection_kind: generation_rule, selected_rule: "Generate exactly 15 non-overlapping correction oneOf branches from correction_variant_mappings. Each branch fixes corrected_record_kind, erroneous_record_id grammar via subject_id_type_ref, subject_field, and affected_projections to exactly the mapped owner_projection plus governance_correction_index. Reject an unknown kind, swapped ID/projection, zero or multiple owner projections, missing governance correction index, or generic fallback branch.", generator_byte_change_allowed: false, source_citation: 06d §1.4, decision_basis: conservative_proposal}
- {decision_id: proposal_decision/resource_request_profile_discriminator, family_ref: family/resource_operation, selection_kind: generation_rule, selected_rule: "Use object_variant_rules as the sole closed JSON discriminator authority for the unified object/resource_request: operational_profile has exactly trivial, bounded, and long_running branches; each branch requires its non-null matching profile-evidence object, forbids both other profile-evidence objects, and has no fallback. all_listed_reusable_object_fields_required is true, so every listed nested field is present; nullable metadata permits only a required key whose value may be null. Claimed applicability and terminal-receipt evidence use non-empty evidence lists.", generator_byte_change_allowed: false, source_citation: W8 §11.1, decision_basis: conservative_proposal}
- {decision_id: proposal_decision/review_condition_gate_relation, family_ref: family/review, selection_kind: generation_rule, selected_rule: "Represent each review condition as a closed object carrying text, a conservatively proposed non_blocking/blocking disposition, typed nullable owner actor, policy ID, and non-empty evidence. Freeze the total six-verdict map: approve is satisfied; approve_with_conditions is satisfied only for at least one condition when every item is non_blocking with a non-null typed actor owner, policy, and non-empty evidence; changes_requested, reject, unable_to_verify, and withdrawn are unsatisfied. A verdict never directly changes Task state.", generator_byte_change_allowed: false, source_citation: W2 §§17.3-17.4, decision_basis: conservative_proposal}
