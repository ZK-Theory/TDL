schema_version: 1.0.0
lifecycle: context-packet-v1
scopes:
  RequestContextPacket: context.request
  BeginContextCompilation: context.compile
  CompleteContextCompilation: context.compile
  ValidateContextPacket: context.validate
  IssueContextPacket: context.issue
  RecordContextDelivery: context.deliver
  FailContextPacket: context.fail
  ExpireContextPacket: context.expire
