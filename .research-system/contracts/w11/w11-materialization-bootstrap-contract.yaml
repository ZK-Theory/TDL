    - w11-catalogue-acceptance-envelope
    - w11-materialization-bootstrap-contract
    - import-accepted-w11-catalogue-genesis
forbidden:
  - runtime_schema_registry binding
  - runtime handlers, ledger append, reducers, or projectors
  - expected catalogue instance
  - catalogue acceptance envelope instance
  - OR-140 genesis import
  - dossier admission, path write, transition, migration, or cutover
  - provider, credential, Jira, PR, or merge action
