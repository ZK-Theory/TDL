    - test_upstream_contract_is_strict_pending_and_identity_separated
    - test_external_record_schema_catalogue_rejects_missing_alias_swap_and_stale_content
    - test_candidate_schema_is_proposed_only_and_has_no_acceptance_surface
    - test_external_acceptance_requires_independent_exact_subject_records
    - test_hash_valid_external_record_semantic_mutations_are_rejected
    - test_raw_candidate_bytes_define_portable_review_subject
    - test_exact_reference_set_rejects_missing_extra_duplicate_alias_swap_and_foreign_rows
    - test_lane_reference_relations_reject_dangling_swapped_and_pending_rows
    - test_exact_fixture_set_rejects_missing_extra_duplicate_and_attack_swaps
    - test_no_op_degenerate_and_claim_escalation_rows_have_upstream_negatives_and_downstream_stop
    - test_complete_w5_obligation_rows_reject_missing_duplicate_swap_and_free_text
    - test_distribution_currency_and_identity_mutations_fail_closed
    - test_coordinated_candidate_and_oracle_replacement_does_not_change_external_authority
    - test_external_schema_identity_resolves_via_git_object_oracle_across_crlf_and_lf_checkouts
    - test_dirty_or_uncommitted_schema_bytes_are_rejected_by_a_distinct_check
    - test_upstream_contract_and_schema_subjects_resist_stale_foreign_and_coordinated_replacement
    - test_requirement_reference_binds_single_authoritative_content_hash
    - test_contract_schema_lifecycle_requires_content_addressed_external_authority_records
    - test_accepted_requirement_binds_content_subject_and_exact_obligation_applicability_rows
    - test_applicability_decision_times_are_bounded_by_relationship_and_acceptance
    - test_independently_confirmed_not_applicable_is_reachable_and_fails_closed
    - test_c1_coordinated_full_store_forgery_cannot_supply_bodies_and_hash_oracle
    - test_c2_bare_review_verdict_cannot_replace_canonical_requirement_and_two_key_closure
    - test_m1_distinct_actor_uuid_and_asserted_i2_fail_without_fresh_task_provenance
    - test_m2_coordinated_stale_reference_pin_fails_current_snapshot_revalidation
  task_local_unbound_test_functions:
    - test_scope_stop_future_pack_is_absent_in_remediation_task

review_gate:
  current_candidate_state: pending_fresh_independent_re_review
  prior_review_verdict: rework_required
  prior_review_is_acceptance: false
  fresh_independent_reviewer:
    assignment_status: unassigned
    decision_status: pending
  owner_acceptor:
    authority: Stephen
    canonical_actor_and_grant_resolution_status: pending_external_record
    decision_status: pending
  future_pack_producer:
    assignment_status: prohibited_until_contract_owner_acceptance_and_w1_id_materialization
    must_differ_from_contract_author: true
  current_disposition: stop_for_fresh_independent_re_review_and_stephen_acceptance

hard_stops:
  future_pack_file_created: false
  assurance_pack_id_materialized: false
  production_semantic_seam_implemented: false
  core_lifecycle_or_authority_changed: false
  live_call_made: false
  research_executed: false
  result_or_claim_created: false
  migration_or_eligibility_transition: false
  results_path_written: false
  credentials_or_env_contents_accessed: false
  self_review_counts_as_approval: false
