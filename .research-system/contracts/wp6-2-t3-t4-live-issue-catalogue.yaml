  canonicalization: RFC8785_canonical_json_UTF8
  construction: explicit_schema_allowlist_never_delete_arbitrary_caller_keys
  excluded_fields:
  - claim_intent_hash
  - credential_use_receipt_id
  - credential_use_receipt_revision
  - credential_use_receipt_hash
  - payload_hash
  - submitted_at
  - recorded_at
  final_payload_hash_covers_intent_and_credential_receipt: true
dependency_graph:
  edge_meaning: A_to_B_means_B_directly_hashes_or_binds_A
  direct_edges:
  - [LiveIssueBinding, claim_intent_hash]
  - [claim_intent_hash, CredentialUseReceipt]
  - [claim_intent_hash, completed_claim_payload_hash]
  - [LiveIssueBinding, completed_claim_payload_hash]
  - [CredentialUseReceipt, completed_claim_payload_hash]
  forbidden_edges:
  - [CredentialUseReceipt, LiveIssueBinding]
  - [CredentialUseReceipt, claim_intent_hash]
  acyclic: true
reservation_authorities:
- reservation: {id: rsv_018f47a2-9b3c-7def-8abc-0123456789ab, revision: 1, hash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
  cost_grant: {id: cgr_018f47a2-9b3c-7def-8abc-0123456789ab, revision: 1, hash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
  provider_command: {id: pcmd_018f47a2-9b3c-7def-8abc-0123456789ab, revision: 1, hash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
  rate_mode: metered
  reserved_input_tokens: 10
  reserved_output_tokens: 10
  total_token_ceiling: 20
  input_rate: 1000000
  output_rate: 1000000
  reserved_cost_microunits: 20
  cost_ceiling_microunits: 100
  pre_reconciliation_remaining_cost_microunits: 80
  currency: USD_MICRO
  rate_evidence: {id: rate_018f47a2-9b3c-7def-8abc-0123456789ab, revision: 1, hash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
  zero_cost_authority: null
