annex_id: w9-catalogue-owner-annex/1
global_preconditions:
- 'G1: the target store''s identity is not the frozen Gate 6 identity, read unbound before binding (W9-T20)'
- 'G2: the W9 genesis is present in the replayed projection (every row but LR-001)'
- 'G3: an observer or reviewer who produced the item is refused (06v WP9.2; W9 §8.6)'
- 'G4: the scoped grant binds the row''s exact authority subject; a path-only, role-only or wildcard subject never satisfies a row'
- 'G5 (every row resolved by Stephen that writes a W9 record; not the recovery, reviewer-eligibility or integration-pilot Decisions, which write none; W9 §13.1; W9-T21): the Decision is resolved by Stephen,
  of kind migration_authority, and its subject is this record''s pre-assigned ID and exact content hash; the review it names is satisfied on that same hash; and the record''s review and Decision refs are
  exactly the proposal''s pre-assigned rev_ and dec_ IDs, which are the review satisfied and the Decision resolved (P-005; W9 §8.5 item 5; S-007)'
suspension_rule: 'An adoption is projected suspended while any of these exists: a later observation of its source, where the source is the registration plus the adoption''s selector (a whole-file adoption:
  any later observation of the registration; an item adoption: a later observation of the same item selector), whether or not the bytes changed; a supersession of a record it relies on, which is its observation,
  that observation''s closed-reference acceptance, or the adoption itself; a recorded use-time mismatch (P-072 item 3)'
derivation_rules:
- complete_write_set = the ordered_events' event tokens, then affected_streams
- receipt_identity = 'R:' + logical_key; logical_key = payload_discriminant
- positive_test_identity = W9-C01-<row id>; negative_mutation_test_identity = W9-C03-<row id>-owner-row-mutation; retry_test_identity = W9-C11-<row id>
- owner_annex_ref = the annex's main commit, blob and SHA-256, plus the SHA-256 of the row's canonical JSON (sorted keys, no whitespace, source_refs included)
- preconditions = the row's own list; the global preconditions G1 to G5 apply by their stated scope and are not repeated per row
- a content hash is SHA-256 of canonical_bytes over the record without content_hash (the W11 rule)
- a record written at resolution takes its created_at and created_by_actor_id from the proposal
- a row with no W9-T test carries a w9c_only_reason and at least one W9-C2x test
catalogue_tests:
  W9-C01: 'positive: the catalogue row equals the row derived from this annex (per row: W9-C01-LR-nnn)'
  W9-C03: 'negative mutation: any one field of the catalogue row mutated is detected (W9-C03-LR-nnn-owner-row-mutation)'
  W9-C11: 'retry: the row''s command, retried with the same idempotency key, appends nothing new (W9-C11-LR-nnn)'
  W9-C20: a reviewer who produced the item, shares the analyst's session, or is not the eligible session is refused
  W9-C21: a verdict recorded by anyone other than the reviewer the request named is refused
  W9-C22: a request, verdict or decision proposal on a stale proposal hash is refused (S-007)
  W9-C23: a resolution whose record refs differ from the proposal's pre-assigned IDs, or whose bytes differ from the proposal, is refused
  W9-C24: a proposal for legacy_owned -> closed_reference is refused
  W9-C25: a proposal whose content fails its record schema, or whose pre-assigned IDs already exist, is refused
