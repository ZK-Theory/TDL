[project]
name = "tdl"
version = "0.1.0"
description = "Topological Data Analysis for Financial Market Regime Detection and UK Poverty Trap Analysis"
readme = "README.md"
requires-python = "==3.13.5"
authors = [
    { name = "TDL Project" }
]
dependencies = [
    # numpy 2.x required for Python 3.13; 1.x has no cp313 wheels
    "numpy==2.3.2",
    "pandas>=2.0.0",
    "scipy==1.16.1",
    # sklearn 1.3.2 has no Python 3.13 wheels; 1.8.0 is the installed version
    # T0.5 will diagnose the GMM regime-label collapse under this pin
    "scikit-learn==1.8.0",
    # giotto-tda has no Python 3.13 wheels; commented out pending upstream release
    # "giotto-tda>=0.6.0",
    "gudhi==3.11.0",
    "pot==0.9.6.post1",
    "yfinance>=0.2.52",
    "fredapi>=0.5.0",
    "requests>=2.28.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "pyvista>=0.42.0",
    "xgboost>=2.0.0",
    "joblib>=1.3.0",
    "torch>=2.0.0",
    # "torch-geometric>=2.4.0",
    # "torch-scatter>=2.1.0",
    # "torch-sparse>=0.6.0",
    "libpysal>=4.9.0",
    "ripser==0.6.14",
    "persim==0.3.8",
    "umap-learn>=0.5.0",
    "scikit-dimension>=0.3.4",
    # Math-correctness contracts framework (contracts/ + .claude/hooks/contract_binding_check.py).
    # Both kept in core deps so the pre-commit hook works for every developer
    # without needing --extra dev. PyYAML was already locked transitively via pre-commit.
    "PyYAML>=6.0",
    "jsonschema>=4.20",
    # jsonschema registers its own "date-time" format checker only when this
    # package is present; without it, schema_registry.py installs a fallback.
    # Undeclared, the live implementation was a property of whoever provisioned
    # the venv, and the fallback diverged from upstream unnoticed (it rejected
    # null, which upstream accepts vacuously) -- 90 failures in
    # test_release_publication.py on machines that lacked it, none on machines
    # that had it. Declared so the primary path is deterministic; the fallback
    # is retained for envs that strip it, and pinned to upstream semantics by
    # test_schema_registry.py::test_fallback_date_time_checker_matches_upstream.
    "rfc3339-validator>=0.1.4",
    # Used by run_t128_bh_fdr.py, run_fdr_correction.py, nssec_missingness.py,
    # age_stratified.py, assess_information_content.py -- was already imported
    # in 5 files but never declared; latent gap, not previously hit until
    # run_t128_bh_fdr.py's BH-FDR step (2026-07-09, T1.28).
    "statsmodels>=0.14.0",
]

[project.scripts]
ars = "research_system.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.0.0",
]
kriging = [
    "pykrige>=1.7.0",
]
mapper = [
    "kmapper>=2.0.0",
]
wasserstein = [
    "pot>=0.9.0",
]

# PETLS is deliberately a dependency GROUP, not an extra. The documented Windows
# provisioning step is `uv sync --all-extras`, which selects every extra -- an
# extra would put the build back exactly where it was. Groups are selected only
# by `--group`/`--all-groups`, so the default sync stays clean.
#
# Why it is optional at all (2026-07-29): petls ships no Windows wheel, so every
# fresh worktree fell back to the sdist, whose CMake step needs Boost and fails.
# That failure surfaced through the pre-commit contract gate, which reports it as
# a contract violation -- an environment problem wearing a correctness problem's
# clothes, in a repo whose history already includes a gate being routed around.
#
# Nothing depends on it being installed. `trajectory_tda.topology.persistent_laplacian`
# resolves petls -> petls-pytorch -> numpy-schur-scratch behind `PETLS_AVAILABLE`,
# and every result JSON records `backend_used`, so provenance survives its absence.
# The C1 Fiedler line that used it closed NEGATIVE and terminal (2026-07-07); the
# `t128-spike-4-persistent-laplacians` line may want it again, which is why this is
# a demotion and not a removal.
#
# To install (works cleanly on Linux, where the cp313 manylinux wheel exists):
#   uv sync --group petls
[dependency-groups]
petls = [
    "petls>=1.0.1",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["financial_tda*", "poverty_tda*", "shared*", "trajectory_tda*", "research_system*"]

[tool.setuptools.package-data]
"research_system.projection" = ["data/*.json", "data/*.yaml"]

[tool.ruff]
# NOTE: the root .ruff.toml takes precedence over this section when present;
# line-length here mirrors it to avoid documenting a conflicting limit.
line-length = 120
target-version = "py313"
exclude = ["docs/notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Notebooks have relaxed linting for line length and import ordering
"*.ipynb" = ["E501", "E402", "I001", "F401", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["financial_tda", "poverty_tda", "shared", "trajectory_tda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers --cov=financial_tda --cov=poverty_tda --cov=shared --cov=trajectory_tda"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "validation: marks tests as mathematical validation tests",
]

[tool.bandit]
# Security scanning targets production code. The test suite legitimately uses
# bare `assert` -- the canonical pytest idiom (pytest rewrites asserts for rich
# introspection) and never run under `python -O`, so Bandit's B101 (assert_used)
# is a false positive there. `exclude_dirs` is the TOML-supported mechanism for
# this (per-path `assert_used.skips` is only honoured from a YAML config); it
# omits the test tree from scanning while every Bandit check still runs on the
# production packages.
exclude_dirs = ["tests"]

[tool.uv]
# petls 1.0.1's sdist sets `cmake.verbose`, which scikit-build-core >= 0.10
# rejects with a hard error at build time ("Use build.verbose instead"), and
# petls ships no Windows wheels, so any sync that selects it falls back to the
# sdist. Retained because `uv sync --group petls` still hits that build path;
# the default sync no longer selects petls at all (see [dependency-groups]).
#
# Superseded 2026-07-29: the note that uv 0.6.5 ignores this key no longer
# applies -- uv is 0.11.29 and honours it. The `--no-install-package petls`
# plus manual venv-seeding ritual in using-git-worktrees-extras is likewise no
# longer needed for a working environment; it is only relevant to someone
# deliberately provisioning the backend on Windows.
build-constraint-dependencies = ["scikit-build-core<0.10"]
